<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Learning Paths | Obaid Doctrine</title><style>body{margin:0;background:#fafaf5;color:#31543a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px 70px}.top{margin-bottom:25px}.brand{font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #dce8b5;border-radius:20px;padding:22px}.tag{display:inline-block;background:#dce8b5;border-radius:99px;padding:5px 9px;font-size:.8rem;font-weight:700}.btn{display:inline-block;margin-top:14px;background:#31543a;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:800}.step{padding:13px 0;border-bottom:1px solid #dce8b5}.muted{color:#6f756f}.notice{margin:18px 0;padding:12px;background:#dce8b5;border-radius:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}}a{color:#31543a}</style></head><body><main class="wrap"><header class="top"><div class="brand">OBAID DOCTRINE</div></header><section id="app"></section></main><script src="/member/analytics.js?v=20260929"></script><script src="/member/member-auth.js?v=20260929"></script><script src="/member/member-nav.js?v=20260929"></script><script src="/member/progress/progress-tracker.js?v=20260929"></script><script src="/member/learning-paths/learning-path.js?v=20260929"></script><script>(async()=>{if(!await ODMember.requireSession())return;const paths={self:{title:"Understanding Yourself",desc:"Build practical self-awareness through observation, reflection and educational psychology concepts.",steps:["Notice patterns in attention, habits and reactions.","Use a Mind Test as a reflection prompt, not a diagnosis.","Write one observation in your private journal.","Review what you learned and choose one small practice." ]},communication:{title:"Better Communication",desc:"Explore listening, clarity, boundaries and respectful responses in everyday relationships.",steps:["Identify the difference between listening and preparing a reply.","Practice one clear, respectful request.","Reflect on a recent conversation without blaming yourself or others.","Choose one communication habit to practice this week."]},decisions:{title:"Better Decisions",desc:"Learn a simple educational framework for clearer choices, trade-offs and reflection.",steps:["Define the decision and what matters.","Separate facts, assumptions and unknowns.","Compare options and likely trade-offs.","Record the outcome and what you learned."]}};const key=new URLSearchParams(location.search).get("path");const p=paths[key];const app=document.getElementById("app");if(!p){app.innerHTML='<h1>Learning Paths</h1><p class="muted">Structured educational journeys for knowledge, reflection and practice.</p><div class="grid">'+Object.entries(paths).map(([k,v])=>'<article class="card"><span class="tag">Educational path</span><h2>'+v.title+'</h2><p class="muted">'+v.desc+'</p><a class="btn" href="?path='+k+'">Open Path</a></article>').join("")+'</div>';return}app.innerHTML='<article class="card"><span class="tag">Learning Path</span><h1>'+p.title+'</h1><p class="muted">'+p.desc+'</p><div class="notice">This path supports learning activity and reflection. It does not assess your psychological health or diagnose conditions.</div><div>'+p.steps.map((s,i)=>'<div class="step"><strong>Step '+(i+1)+'</strong><div>'+s+'</div></div>').join("")+'</div><button id="start" class="btn" type="button">Start / Save Progress</button> <button id="done" class="btn" type="button">Mark Path Complete</button><p id="msg" class="muted"></p><p><a href="/member/learning-paths/">← All Learning Paths</a></p></article>';document.getElementById("start").onclick=async()=>{document.getElementById("msg").textContent=await ODLearningPath.start("/member/learning-paths/?path="+key)?"Progress started.":"Could not save progress."};document.getElementById("done").onclick=async()=>{document.getElementById("msg").textContent=await ODLearningPath.complete("/member/learning-paths/?path="+key)?"Path completed.":"Could not save completion."}})()</script></body></html>

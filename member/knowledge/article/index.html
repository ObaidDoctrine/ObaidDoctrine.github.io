<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://www.obaiddoctrine.com/member/knowledge/article/">
<title>Knowledge | Obaid Doctrine</title>
<style>
:root{--forest:#31543a;--lime:#b7d84b;--soft:#dce8b5;--ivory:#fafaf5;--muted:#6f756f;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--forest);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:900px;margin:auto;padding:28px 18px 70px}.top{margin-bottom:25px}.brand{font-weight:900;letter-spacing:.08em}
.card{background:var(--white);border:1px solid var(--soft);border-radius:20px;padding:22px;margin:16px 0;box-shadow:0 7px 24px rgba(49,84,58,.05)}
.hero{background:var(--soft)}.muted{color:var(--muted);line-height:1.65}.section h2{margin-bottom:8px}.source{display:block;color:var(--forest);margin:10px 0;font-weight:700;overflow-wrap:anywhere}
.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--forest);color:var(--white);font-weight:800;cursor:pointer}.btn:disabled{opacity:.6;cursor:wait}
.note{font-size:.94rem}.error{text-align:center;padding:45px 18px}.error a{color:var(--forest);font-weight:800}
ul{padding-left:22px;line-height:1.7}@media(max-width:600px){.wrap{padding:20px 14px 50px}.card{padding:18px;border-radius:18px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand">OBAID DOCTRINE</div></header>
<div id="app" class="card"><p class="muted">Loading knowledge…</p></div>
</main>
<script src="/member/member-auth.js?v=20260929"></script>
<script src="/member/member-nav.js?v=20260929"></script>
<script src="/member/progress/progress-tracker.js?v=20260929"></script>
<script src="/member/analytics.js?v=20260929"></script>
<script>
(async()=>{
"use strict";
const app=document.getElementById("app");
const text=(el,value)=>{el.textContent=String(value??"");return el};
const addTextSection=(parent,heading,value)=>{
 const sec=document.createElement("section");sec.className="card section";
 const h=document.createElement("h2");h.textContent=heading;sec.appendChild(h);
 const p=document.createElement("p");p.className="muted";text(p,value);sec.appendChild(p);parent.appendChild(sec);
};
const addListSection=(parent,heading,values)=>{
 const sec=document.createElement("section");sec.className="card section";
 const h=document.createElement("h2");h.textContent=heading;sec.appendChild(h);
 const ul=document.createElement("ul");
 (Array.isArray(values)?values:[]).forEach(v=>{const li=document.createElement("li");text(li,v);ul.appendChild(li)});
 sec.appendChild(ul);parent.appendChild(sec);
};
try{
 const db=await ODMember.client();
 const auth=await db.auth.getUser();
 if(auth.error||!auth.data.user){location.href="/account/login/";return}
 const slug=new URLSearchParams(location.search).get("slug");
 if(!slug||!/^[a-z0-9-]{2,100}$/.test(slug))throw Error("invalid");
 const r=await db.from("member_content").select("slug,category,title,summary,content,sources").eq("slug",slug).eq("language","en").eq("is_published",true).maybeSingle();
 if(r.error)throw r.error;if(!r.data)throw Error("notfound");
 const x=r.data,c=x.content&&typeof x.content==="object"?x.content:{};
 app.replaceChildren();
 const hero=document.createElement("section");hero.className="card hero";
 const cat=document.createElement("div");cat.className="muted";text(cat,String(x.category||"Knowledge").replace(/-/g," "));hero.appendChild(cat);
 const h1=document.createElement("h1");text(h1,x.title||"Knowledge");hero.appendChild(h1);
 const summary=document.createElement("p");summary.className="muted";text(summary,x.summary);hero.appendChild(summary);app.appendChild(hero);
 addTextSection(app,"Why it matters",c.why_it_matters);
 addTextSection(app,"Evidence",c.evidence);
 addTextSection(app,"Limitations",c.limitations);
 addListSection(app,"Common misconceptions",c.misconceptions);
 addTextSection(app,"Reflection",c.reflection_prompt);
 addTextSection(app,"Practice",c.practice);
 const sources=document.createElement("section");sources.className="card section";
 const sh=document.createElement("h2");sh.textContent="Sources";sources.appendChild(sh);
 const sourceItems=Array.isArray(x.sources)?x.sources:[];
 sourceItems.forEach(s=>{
   if(!s||typeof s!=="object")return;
   let url="";
   try{const u=new URL(String(s.url||""),location.origin);if(u.protocol==="https:"||u.protocol==="http:")url=u.href}catch(_){}
   if(!url)return;
   const a=document.createElement("a");a.className="source";a.target="_blank";a.rel="noopener noreferrer";a.href=url;text(a,s.title||url);sources.appendChild(a);
 });
 if(!sourceItems.length){const p=document.createElement("p");p.className="muted";text(p,"No sources were added to this item.");sources.appendChild(p)}
 app.appendChild(sources);
 const actions=document.createElement("section");actions.className="card";
 const done=document.createElement("button");done.id="done";done.className="btn";text(done,"Mark as complete");actions.appendChild(done);
 const status=document.createElement("p");status.id="status";status.className="muted";actions.appendChild(status);app.appendChild(actions);
 done.addEventListener("click",async()=>{
   done.disabled=true;text(status,"Saving…");
   try{const r=await ODProgress.complete("member_content",location.pathname+location.search);text(status,r.saved?"Completed and added to your learning progress.":"Could not save completion right now.")}
   catch(_){text(status,"Could not save completion right now.")}
   done.disabled=false;
 });
}catch(e){
 console.warn(e);app.replaceChildren();app.className="card error";
 const h=document.createElement("h1");text(h,"Knowledge unavailable");app.appendChild(h);
 const p=document.createElement("p");p.className="muted";text(p,"We could not load this member knowledge item right now.");app.appendChild(p);
 const a=document.createElement("a");a.href="/member/knowledge/";text(a,"Back to Member Knowledge");app.appendChild(a);
}
})();
</script>
</body>
</html>

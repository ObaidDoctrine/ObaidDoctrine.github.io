<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Member Knowledge | Obaid Doctrine</title>
<meta name="description" content="Private research-informed educational knowledge for Obaid Doctrine members.">
<link rel="canonical" href="https://www.obaiddoctrine.com/member/knowledge/">
<style>
:root{--green:#31543a;--lime:#b7d84b;--soft:#dce8b5;--ivory:#fafaf5;--muted:#6f756f}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--green);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px 18px 70px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:26px}.brand{font-weight:900;letter-spacing:.04em}.nav{display:flex;gap:14px;flex-wrap:wrap}.nav a{color:var(--green);font-weight:800;text-decoration:none}
.hero,.card{background:#fff;border:1px solid rgba(49,84,58,.12);border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(49,84,58,.06)}.hero{margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{min-width:0}.meta{font-size:.82rem;color:var(--muted);font-weight:800;text-transform:capitalize}.card h2{margin:.55rem 0}.card a{color:var(--green);text-decoration:none}.read{display:inline-block;margin-top:8px;font-weight:900}.count{display:inline-block;margin-top:10px;padding:6px 10px;border-radius:999px;background:var(--soft);font-weight:800}.state{text-align:center;padding:45px 20px}.muted{color:var(--muted)}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.hero,.card{padding:19px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand">OBAID DOCTRINE</div><nav class="nav"><a href="/member/dashboard/">Dashboard</a><a href="/member/progress/">Progress</a><a href="/member/library/">My Library</a><a href="/member/journal/">Reflection Journal</a><a href="/member/profile/">Profile</a></nav></header>
<section class="hero"><h1>Member Knowledge</h1><p class="muted">Research-informed educational material built around Knowledge → Reflection → Practice → Progress.</p><div id="count" class="count">Loading…</div></section>
<section id="grid" class="grid"><article class="card state"><p>Loading knowledge…</p></article></section>
</main>
<script src="/member/member-auth.js?v=20260929"></script>
<script>
(async()=>{
"use strict";
const grid=document.getElementById("grid"),count=document.getElementById("count");
const make=(tag,text,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text??"";return e};
try{
 const s=await ODMember.requireSession();if(!s)return;
 const db=await ODMember.client();
 const auth=await db.auth.getUser();if(auth.error||!auth.data.user)throw(auth.error||new Error("User verification failed."));
 const r=await db.from("member_content").select("slug,category,title,summary").eq("language","en").eq("is_published",true).order("category").order("title").limit(100);
 if(r.error)throw r.error;
 const rows=r.data||[];count.textContent=rows.length+" "+(rows.length===1?"item":"items");grid.replaceChildren();
 if(!rows.length){const c=document.createElement("article");c.className="card state";c.appendChild(make("h2","No published knowledge yet"));c.appendChild(make("p","New member learning material will appear here when published." ,"muted"));grid.appendChild(c);return}
 rows.forEach(x=>{
  const c=document.createElement("article");c.className="card";
  c.appendChild(make("div",String(x.category||"Knowledge").replaceAll("-"," "),"meta"));
  c.appendChild(make("h2",x.title||"Untitled knowledge"));
  c.appendChild(make("p",x.summary||"Research-informed educational material.","muted"));
  const a=document.createElement("a");a.className="read";a.href="/member/knowledge/article/?slug="+encodeURIComponent(x.slug);a.textContent="Read knowledge →";c.appendChild(a);grid.appendChild(c);
 });
}catch(e){console.warn(e);grid.replaceChildren();const c=document.createElement("article");c.className="card state";c.appendChild(make("h2","Knowledge unavailable"));c.appendChild(make("p","We could not load member knowledge right now. Please try again.","muted"));grid.appendChild(c)}
})();
</script>
<script src="/member/member-nav.js?v=20260929"></script>
</body>
</html>

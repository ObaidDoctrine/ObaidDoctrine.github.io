<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Member Knowledge | Obaid Doctrine</title><style>body{margin:0;background:#fafaf5;color:#31543a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px 70px}.top{margin-bottom:25px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #dce8b5;border-radius:20px;padding:20px}.muted{color:#6f756f}.card a{color:#31543a;text-decoration:none}.meta{font-size:.85rem;font-weight:700;text-transform:capitalize;color:#6f756f}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><strong>OBAID DOCTRINE</strong></header><h1>Member Knowledge</h1><p class="muted">Research-informed educational material built for Knowledge → Reflection → Practice → Progress.</p><div id="grid" class="grid"><article class="card"><p>Loading knowledge…</p></article></div></main><script src="/member/member-auth.js?v=20260929"></script><script src="/member/member-nav.js?v=20260929"></script><script>(async()=>{const g=document.getElementById("grid");try{const s=await ODMember.requireSession();if(!s)return;const db=await ODMember.client();const r=await db.from("member_content").select("slug,category,title,summary").eq("language","en").eq("is_published",true).order("category").order("title");if(r.error)throw r.error;const rows=r.data||[];g.innerHTML=rows.length?rows.map(x=>'<article class="card"><div class="meta">'+x.category.replaceAll("-"," ")+'</div><h2><a href="/member/knowledge/article/?slug='+encodeURIComponent(x.slug)+'">'+x.title.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))+'</a></h2><p>'+x.summary.replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]))+'</p><a href="/member/knowledge/article/?slug='+encodeURIComponent(x.slug)+'">Read knowledge →</a></article>').join(""):'<article class="card"><p>No published knowledge is available yet.</p></article>'}catch(e){console.warn(e);g.innerHTML='<article class="card"><p>We could not load member knowledge right now.</p></article>'}})();</script></body></html>

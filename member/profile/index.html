<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Profile | Obaid Doctrine</title><link rel="canonical" href="https://www.obaiddoctrine.com/member/profile/"><style>body{margin:0;background:#fafaf5;color:#31543a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:720px;margin:auto;padding:30px 18px 70px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.brand{font-weight:800;letter-spacing:.04em}a{color:#31543a;font-weight:700}.card{background:#fff;border:1px solid #dce8b5;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(49,84,58,.06)}label{display:block;font-weight:700;margin:16px 0 6px}input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd8cc;border-radius:10px;font:inherit}input[readonly]{background:#f3f4ee}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#31543a;color:#fff;font-weight:800;font:inherit}.msg{margin-top:14px;padding:10px;border-radius:10px;background:#dce8b5}.muted{color:#6f756f}</style></head><body><main class="wrap"><header class="top"><div class="brand">OBAID DOCTRINE</div><a href="/member/dashboard/">Dashboard</a></header><section class="card"><h1>My Profile</h1><p class="muted">Manage the basic information used for your member account.</p><form id="f"><label>Display Name</label><input id="name" maxlength="80" required><label>Email</label><input id="email" type="email" readonly><label>Preferred Language</label><select id="language"><option value="en">English</option><option value="ur">اردو</option></select><label>Account Created</label><input id="created" readonly><button>Save Profile</button></form><div id="msg" class="msg" hidden></div><p><a href="/member/logout/">Log Out</a></p></section></main><script src="/member/member-auth.js?v=20260929"></script><script>(async()=>{const m=document.getElementById("msg");try{const session=await ODMember.requireSession();if(!session)return;const db=await ODMember.client();const u=session.user;document.getElementById("email").value=u.email||"";document.getElementById("created").value=new Date(u.created_at).toLocaleString();const r=await db.from("profiles").select("display_name,preferred_language,created_at").eq("id",u.id).maybeSingle();if(r.error)throw r.error;document.getElementById("name").value=(r.data&&r.data.display_name)||u.user_metadata?.display_name||"";document.getElementById("language").value=(r.data&&r.data.preferred_language)||u.user_metadata?.preferred_language||"en";document.getElementById("f").onsubmit=async e=>{e.preventDefault();m.hidden=true;const x=await db.from("profiles").upsert({id:u.id,display_name:document.getElementById("name").value.trim(),preferred_language:document.getElementById("language").value,updated_at:new Date().toISOString()},{onConflict:"id"});if(x.error){m.textContent="We could not save your profile. Please try again.";m.hidden=false;return}m.textContent="Profile saved.";m.hidden=false}}catch(e){console.warn(e);m.textContent="We could not load your profile right now.";m.hidden=false}})()</script></body></html>

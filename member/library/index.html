<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Library | Obaid Doctrine</title><link rel="canonical" href="https://www.obaiddoctrine.com/member/library/"><link rel="stylesheet" href="../../styles.css?v=20260929"><style>body{background:#fafaf5;color:#31543a}.wrap{max-width:980px;margin:auto;padding:32px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:800}.top a,a{color:#31543a;font-weight:700}.card{background:#fff;border:1px solid #dce8b5;border-radius:22px;padding:24px;margin:14px 0;box-shadow:0 8px 28px rgba(49,84,58,.06)}.item{display:flex;justify-content:space-between;gap:18px;align-items:center;border-top:1px solid #e8eedb;padding:16px 0}.item:first-child{border-top:0}.path{font-size:.9rem;color:#6f756f;word-break:break-word}.btn{border:0;border-radius:10px;padding:10px 14px;background:#31543a;color:#fff;font-weight:800;cursor:pointer}.state{text-align:center;padding:48px 20px}.msg{padding:10px;border-radius:10px;background:#dce8b5;margin-top:14px}@media(max-width:650px){.item{align-items:flex-start;flex-direction:column}.btn{width:100%}}</style></head><body><main class="wrap"><header class="top"><div class="brand">OBAID DOCTRINE</div><nav><a href="/member/dashboard/">Dashboard</a> · <a href="/member/profile/">Profile</a></nav></header><section id="app" class="card state"><h1>My Library</h1><p>Loading your saved articles…</p></section></main><script src="/member/member-auth.js?v=20260929"></script><script>(async()=>{const app=document.getElementById("app");function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}function title(p){try{const x=p.split("/").filter(Boolean).pop()||p;return x.replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase())}catch(e){return p}}try{const s=await ODMember.requireSession();if(!s)return;const db=await ODMember.client();const r=await db.from("saved_articles").select("id,article_path,created_at").order("created_at",{ascending:false});if(r.error)throw r.error;if(!r.data.length){app.innerHTML='<h1>My Library</h1><p>You have not saved any articles yet.</p><a href="/#insights">Explore Articles</a>';return}app.className="card";app.innerHTML='<h1>My Library</h1><p>Articles you saved for later.</p>'+r.data.map(x=>'<article class="item"><div><h2>'+esc(title(x.article_path))+'</h2><div class="path">'+esc(x.article_path)+'</div></div><div><a class="btn" href="'+encodeURI(x.article_path)+'">Open</a> <button class="btn" data-id="'+x.id+'">Remove</button></div></article>').join("");app.querySelectorAll("button[data-id]").forEach(b=>b.onclick=async()=>{b.disabled=true;const d=await db.from("saved_articles").delete().eq("id",b.dataset.id);if(d.error){b.disabled=false;alert("Could not remove this article.");return}location.reload()})}catch(e){console.warn(e);app.innerHTML='<h1>My Library</h1><p>We could not load your saved articles right now.</p>'}})()</script></body></html>

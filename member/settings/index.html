<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Settings | Obaid Doctrine</title><meta name="description" content="Manage your member profile, language, password and privacy preferences."><link rel="canonical" href="https://www.obaiddoctrine.com/member/settings/index.html"><style>body{margin:0;background:#fafaf5;color:#31543a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:720px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:24px}.brand{font-weight:800}.card{background:#fff;border:1px solid #dce8b5;border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(49,84,58,.06);margin-bottom:16px}a{color:#31543a;font-weight:700}label{display:block;font-weight:700;margin:15px 0 6px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #cfd8cc;border-radius:10px;font:inherit}button{width:100%;margin-top:18px;padding:13px;border:0;border-radius:12px;background:#31543a;color:#fff;font-weight:800;font:inherit}#msg{margin-top:14px;color:#31543a;font-weight:700}@media(max-width:700px){.top{align-items:flex-start}.card{padding:19px}}</style></head><body><main class="wrap"><header class="top"><div class="brand">OBAID DOCTRINE</div><a href="/member/dashboard/">Dashboard</a></header><section class="card"><h1>Settings</h1><p>Manage your member profile, language, password and privacy preferences.</p><p><a href="/member/profile/">Profile</a> · <a href="/member/privacy/">Privacy & Data</a></p><form id="settings"><label>Preferred Language</label><select id="language" style="width:100%;padding:12px;border:1px solid #cfd8cc;border-radius:10px;font:inherit"><option value="en">English</option><option value="ur">اردو</option></select><button type="submit">Save Settings</button></form><hr style="border:0;border-top:1px solid #dce8b5;margin:26px 0"><h2>Change Password</h2><p>Leave password fields empty if you do not want to change it.</p><label>New Password</label><input id="pw" type="password" autocomplete="new-password"><label>Confirm New Password</label><input id="pw2" type="password" autocomplete="new-password"><button id="change" type="button">Change Password</button><div id="msg" role="status" aria-live="polite"></div></section></main><script src="/account/auth.js?v=20260929"></script><script src="/member/member-auth.js?v=20260929"></script><script src="/member/member-nav.js?v=20260929"></script><script>(async()=>{const s=await ODAuth.session();if(!s){location.href="/account/login/?next="+encodeURIComponent(location.pathname);return}const db=await ODAuth.client();const {data}=await db.from("profiles").select("preferred_language").eq("id",s.user.id).maybeSingle();document.getElementById("language").value=(data&&data.preferred_language)||s.user.user_metadata?.preferred_language||"en";document.getElementById("settings").onsubmit=async e=>{e.preventDefault();const lang=document.getElementById("language").value;const r=await db.from("profiles").upsert({id:s.user.id,preferred_language:lang,updated_at:new Date().toISOString()},{onConflict:"id"});document.getElementById("msg").textContent=r.error?"We could not save your settings right now.":"Settings saved."};document.getElementById("change").onclick=async()=>{const a=document.getElementById("pw").value,b=document.getElementById("pw2").value;if(!a&&!b){document.getElementById("msg").textContent="Leave password fields empty if you do not want to change it.";return}if(a!==b){document.getElementById("msg").textContent="Passwords do not match.";return}if(a.length<8){document.getElementById("msg").textContent="Password must be at least 8 characters.";return}const r=await db.auth.updateUser({password:a});document.getElementById("msg").textContent=r.error?r.error.message:"Password updated. Please use your new password next time you log in."};})();</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://www.obaiddoctrine.com/member/logout/">
<title>Log Out | Obaid Doctrine</title>
<style>
:root{--forest:#31543a;--lime:#b7d84b;--soft:#dce8b5;--ivory:#fafaf5;--muted:#6f756f;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--forest);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.box{max-width:560px;margin:12vh auto;padding:24px 18px}.card{background:var(--white);border:1px solid var(--soft);border-radius:24px;padding:30px;text-align:center;box-shadow:0 8px 28px rgba(49,84,58,.06)}
.brand{font-weight:900;letter-spacing:.08em}.muted{color:var(--muted);line-height:1.6}.btn{display:inline-block;margin-top:14px;padding:11px 15px;border-radius:11px;background:var(--forest);color:#fff;text-decoration:none;font-weight:800}
@media(max-width:600px){.card{padding:22px}}
</style>
</head>
<body>
<main class="box"><section class="card" aria-live="polite"><div class="brand">OBAID DOCTRINE</div><h1 id="title">Logging out…</h1><p id="m" class="muted">Please wait.</p><a id="back" class="btn" href="/account/login/" hidden>Log In</a></section></main>
<script src="/member/member-auth.js?v=20260929"></script>
<script>
(async()=>{
 const m=document.getElementById("m"),title=document.getElementById("title"),back=document.getElementById("back");
 try{
  const r=await ODMember.logout();
  if(r.error)throw r.error;
  title.textContent="You have been logged out.";
  m.textContent="Your member session has been signed out. Redirecting to login…";
  back.hidden=false;
  setTimeout(()=>location.href="/account/login/",900);
 }catch(e){
  console.warn(e);
  title.textContent="Logout could not be completed";
  m.textContent="Please try again. If the problem continues, return to your account page.";
  back.hidden=false;
 }
})();
</script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Recommendations | Obaid Doctrine</title><style>body{margin:0;background:#fafaf5;color:#31543a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px 70px}.top{margin-bottom:24px}.brand{font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #dce8b5;border-radius:20px;padding:20px}.muted{color:#6f756f}.btn{display:inline-block;margin-top:12px;background:#31543a;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:800}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div class="brand">OBAID DOCTRINE</div></header><h1>Recommended for You</h1><p class="muted">Suggestions are based only on your activity on this platform—such as completed tests, saved articles and learning paths. They are not psychological assessments.</p><div id="status" class="muted">Loading recommendations…</div><div id="grid" class="grid"></div></main><script src="/member/member-auth.js?v=20260929"></script><script src="/member/member-nav.js?v=20260929"></script><script>(async()=>{if(!await ODMember.requireSession())return;const db=await ODMember.client(),s=await ODMember.session(),u=s.user;const [t,p,a]=await Promise.all([db.from("test_results").select("test_id,completed_at").eq("user_id",u.id).order("completed_at",{ascending:false}),db.from("learning_progress").select("resource_type,resource_path,updated_at").eq("user_id",u.id).order("updated_at",{ascending:false}),db.from("saved_articles").select("article_path,created_at").eq("user_id",u.id).order("created_at",{ascending:false})]);if(t.error||p.error||a.error){document.getElementById("status").textContent="Recommendations are temporarily unavailable.";return}const testIds=new Set((t.data||[]).map(x=>x.test_id));const paths=new Set((p.data||[]).map(x=>x.resource_path));const rec=[];const add=(title,desc,href)=>{if(rec.length<6)rec.push({title,desc,href})};if(!testIds.has("emotional-intelligence"))add("Emotional Intelligence","Explore a self-reflection test about emotional awareness and responses.","/mind-tests/emotional-intelligence/");if(!testIds.has("communication-style"))add("Communication Style","Reflect on communication patterns and everyday interactions.","/mind-tests/communication-style/");if(!paths.has("/member/learning-paths/?path=communication"))add("Better Communication","Continue with a structured learning path focused on listening, clarity and respectful responses.","/member/learning-paths/?path=communication");if(!paths.has("/member/learning-paths/?path=decisions"))add("Better Decisions","Use a practical framework for facts, assumptions, options and trade-offs.","/member/learning-paths/?path=decisions");if((a.data||[]).length) add("Your Library","Return to articles you have chosen to save.","/member/library/");if(!rec.length)add("Keep Learning","Review your progress and choose your next educational activity.","/member/progress/");document.getElementById("grid").innerHTML=rec.map(x=>'<article class="card"><h2>'+x.title+'</h2><p class="muted">'+x.desc+'</p><a class="btn" href="'+x.href+'">Open</a></article>').join("");document.getElementById("status").textContent="These suggestions reflect platform activity, not inferred psychological traits.";})()</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Content | Obaid Doctrine</title></head><body><main><h1>OBAID DOCTRINE — Admin Content</h1><p id="status">Checking administrator access…</p><div id="content"></div></main><script src="/member/member-auth.js?v=20260929"></script><script>(async()=>{const status=document.getElementById('status');const out=document.getElementById('content');const s=await ODMember.requireSession();if(!s)return;const db=await ODMember.client();const r=await db.rpc('is_admin');if(r.error||r.data!==true){status.textContent='Admin access required.';return}status.textContent='Administrator access verified.';const q=await db.from('member_content').select('id,slug,language,category,title,is_published,updated_at').order('updated_at',{ascending:false});if(q.error){out.textContent='Could not load content.';return}out.innerHTML='<p>'+q.data.length+' content records.</p>'+q.data.map(x=>'<article><strong>'+x.title+'</strong> — '+x.language+' — '+(x.is_published?'Published':'Draft')+'</article>').join('')})().catch(()=>{document.getElementById('status').textContent='Admin verification failed.'});</script></body></html>

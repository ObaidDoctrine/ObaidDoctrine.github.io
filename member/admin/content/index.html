<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Content | Obaid Doctrine</title><style>body{margin:0;background:#fafaf5;color:#31543a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px 70px}.card{background:#fff;border:1px solid #dce8b5;border-radius:20px;padding:20px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-weight:700;display:block;margin:10px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cfd8cc;border-radius:10px;font:inherit}textarea{min-height:120px}button{border:0;border-radius:10px;padding:10px 14px;background:#31543a;color:#fff;font-weight:800;margin:6px 6px 0 0}button.alt{background:#6f756f}button.danger{background:#31543a}.muted{color:#6f756f}.item{border-top:1px solid #dce8b5;padding:14px 0}.pill{font-size:.8rem;font-weight:800}.hidden{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header><strong>OBAID DOCTRINE</strong><h1>Admin Content</h1><p id="status" class="muted">Checking administrator access…</p></header><section id="editor" class="card hidden"><h2 id="formTitle">Create Member Knowledge</h2><form id="form"><input id="id" type="hidden"><div class="grid"><div><label for="slug">Slug</label><input id="slug" required pattern="[a-z0-9-]+"></div><div><label for="language">Language</label><select id="language"><option value="en">English</option><option value="ur">Urdu</option></select></div><div><label for="category">Category</label><select id="category"><option value="deep-psychology">Deep Psychology</option><option value="human-behaviour">Human Behaviour</option><option value="relationships">Relationships</option><option value="character-development">Character Development</option><option value="decision-making">Decision Making</option><option value="case-studies">Case Studies</option></select></div><div><label for="title">Title</label><input id="title" required></div></div><label for="summary">Summary</label><textarea id="summary" required></textarea><label for="content">Structured Content JSON</label><textarea id="content" placeholder='{"why_it_matters":[],"evidence":[],"limitations":[],"misconceptions":[],"reflection_prompt":"","practice":[]}'></textarea><label for="sources">Sources JSON</label><textarea id="sources" placeholder='[{"title":"Source","url":"https://example.org"}]'></textarea><label><input id="published" type="checkbox" style="width:auto"> Published</label><button type="submit">Save Content</button><button type="button" id="new" class="alt">New</button><button type="button" id="cancel" class="alt">Cancel</button><p id="msg" class="muted" role="status"></p></form></section><section id="list" class="card hidden"><h2>Content Inventory</h2><div id="rows"></div></section></main><script src="/member/member-auth.js?v=20260929"></script><script>(async()=>{const status=document.getElementById('status'),editor=document.getElementById('editor'),list=document.getElementById('list'),rows=document.getElementById('rows'),form=document.getElementById('form'),msg=document.getElementById('msg');let db,items=[];const esc=v=>String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));const reset=()=>{form.reset();document.getElementById('id').value='';document.getElementById('formTitle').textContent='Create Member Knowledge';msg.textContent=''};const load=async()=>{const q=await db.from('member_content').select('*').order('updated_at',{ascending:false});if(q.error)throw q.error;items=q.data||[];rows.innerHTML=items.map(x=>'<div class="item"><strong>'+esc(x.title)+'</strong><div class="muted">'+esc(x.language)+' · '+esc(x.category)+' · <span class="pill">'+(x.is_published?'Published':'Draft')+'</span></div><button data-edit="'+x.id+'">Edit</button><button data-publish="'+x.id+'">'+(x.is_published?'Unpublish':'Publish')+'</button><button data-delete="'+x.id+'" class="danger">Delete</button></div>').join('')||'<p class="muted">No content records.</p>';rows.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.edit)));rows.querySelectorAll('[data-publish]').forEach(b=>b.onclick=()=>toggle(Number(b.dataset.publish)));rows.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>remove(Number(b.dataset.delete)))};const edit=id=>{const x=items.find(a=>a.id===id);if(!x)return;document.getElementById('id').value=x.id;document.getElementById('slug').value=x.slug;document.getElementById('language').value=x.language;document.getElementById('category').value=x.category;document.getElementById('title').value=x.title;document.getElementById('summary').value=x.summary;document.getElementById('content').value=JSON.stringify(x.content||{},null,2);document.getElementById('sources').value=JSON.stringify(x.sources||[],null,2);document.getElementById('published').checked=!!x.is_published;document.getElementById('formTitle').textContent='Edit Member Knowledge';editor.classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};const toggle=async id=>{const x=items.find(a=>a.id===id);if(!x)return;const r=await db.from('member_content').update({is_published:!x.is_published,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){alert('Could not update publishing status.');return}await load()};const remove=async id=>{if(!confirm('Permanently delete this content record?'))return;const r=await db.from('member_content').delete().eq('id',id);if(r.error){alert('Could not delete this record.');return}await load()};form.onsubmit=async e=>{e.preventDefault();msg.textContent='Saving…';let content,sources;try{content=JSON.parse(document.getElementById('content').value||'{}');sources=JSON.parse(document.getElementById('sources').value||'[]')}catch(_){msg.textContent='Content or sources JSON is invalid.';return}const payload={slug:document.getElementById('slug').value.trim(),language:document.getElementById('language').value,category:document.getElementById('category').value,title:document.getElementById('title').value.trim(),summary:document.getElementById('summary').value.trim(),content,sources,is_published:document.getElementById('published').checked};const id=document.getElementById('id').value;const r=id?await db.from('member_content').update({...payload,updated_at:new Date().toISOString()}).eq('id',id):await db.from('member_content').insert(payload);if(r.error){msg.textContent='Save failed. Check slug/language uniqueness and required fields.';return}msg.textContent='Saved.';reset();await load()};document.getElementById('new').onclick=()=>{reset();editor.classList.remove('hidden')};document.getElementById('cancel').onclick=()=>{reset();editor.classList.add('hidden')};try{const s=await ODMember.requireSession();if(!s)return;db=await ODMember.client();const ar=await db.rpc('is_admin');if(ar.error||ar.data!==true){status.textContent='Admin access required.';return}status.textContent='Administrator access verified.';editor.classList.remove('hidden');list.classList.remove('hidden');await load()}catch(e){console.warn(e);status.textContent='Admin verification failed.'}})();</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>My Progress | Obaid Doctrine</title>
<link rel="canonical" href="https://www.obaiddoctrine.com/member/progress/">
<style>
:root{--green:#31543a;--lime:#b7d84b;--soft:#dce8b5;--ivory:#fafaf5;--muted:#6f756f}
*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--green);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:1080px;margin:auto;padding:28px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-weight:900;letter-spacing:.04em}.top a{color:var(--green);font-weight:800;text-decoration:none}
.hero,.card{background:#fff;border:1px solid rgba(49,84,58,.12);border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(49,84,58,.06)}
h1{margin:.1rem 0 .5rem;font-size:clamp(1.8rem,4vw,2.4rem)}h2{margin:0 0 14px;font-size:1.2rem}.muted{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}.num{font-size:2rem;font-weight:850;margin-top:5px}.pill{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:var(--soft);font-weight:800;font-size:.85rem}
.activity{margin-top:16px}.item{padding:14px 0;border-bottom:1px solid var(--soft)}.item:last-child{border-bottom:0}.item strong{display:block}.item small{display:block;margin-top:3px;color:var(--muted)}
.btn{display:inline-block;margin-top:16px;padding:11px 15px;border-radius:11px;background:var(--green);color:#fff;text-decoration:none;font-weight:800}.notice{padding:12px 14px;border-radius:12px;background:var(--soft);margin-top:14px}
.state{text-align:center;padding:50px 20px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.hero,.card{padding:19px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand">OBAID DOCTRINE</div><nav><a href="/member/dashboard/">Dashboard</a> &nbsp; <a href="/member/my-tests/">My Tests</a></nav></header>
<section id="app" class="hero state"><h1>My Progress</h1><p class="muted">Loading your learning activity…</p></section>
</main>
<script src="/member/member-auth.js?v=20260929"></script>
<script src="/member/member-nav.js?v=20260929"></script>
<script>
(async()=>{
 const app=document.getElementById("app");
 const labels={article:"Article",test:"Mind Test",learning_path:"Learning Path",member_content:"Member Knowledge"};
 try{
  const session=await ODMember.requireSession(); if(!session)return;
  const db=await ODMember.client();
  const auth=await db.auth.getUser();
  if(auth.error||!auth.data.user)throw(auth.error||new Error("User verification failed."));
  const uid=auth.data.user.id;
  const r=await db.from("learning_progress").select("resource_type,resource_path,status,started_at,completed_at,updated_at").eq("user_id",uid).order("updated_at",{ascending:false}).limit(100);
  if(r.error)throw r.error;
  const rows=r.data||[];
  const completed=rows.filter(x=>x.status==="completed");
  const counts={article:0,test:0,learning_path:0,member_content:0};
  completed.forEach(x=>{if(counts[x.resource_type]!==undefined)counts[x.resource_type]++});
  const total=completed.length;
  const stage=total===0?"Exploring":total<3?"Learning":total<7?"Practicing":"Growing";
  app.className="";
  const hero=document.createElement("section");hero.className="hero";
  hero.innerHTML='<h1>My Progress</h1><p class="muted">A private overview of your learning activity on Obaid Doctrine.</p><div class="notice">Progress is an activity record only. It is not a psychological assessment, diagnosis, or measure of personal worth.</div>';
  app.appendChild(hero);
  const grid=document.createElement("section");grid.className="grid";
  [["Articles completed",counts.article],["Tests completed",counts.test],["Learning paths",counts.learning_path],["Knowledge completed",counts.member_content]].forEach(([label,value])=>{
   const card=document.createElement("article");card.className="card";card.innerHTML='<div class="muted">'+label+'</div><div class="num">'+value+'</div>';grid.appendChild(card);
  });
  const totalCard=document.createElement("article");totalCard.className="card";totalCard.innerHTML='<div class="muted">Total completed activity</div><div class="num">'+total+'</div><span class="pill">'+stage+'</span>';grid.appendChild(totalCard);app.appendChild(grid);
  const activity=document.createElement("section");activity.className="card activity";
  const h=document.createElement("h2");h.textContent="Recent activity";activity.appendChild(h);
  const recent=rows.slice(0,10);
  if(!recent.length){
   const p=document.createElement("p");p.className="muted";p.textContent="No progress recorded yet. Complete a Mind Test or mark an article as completed while logged in.";activity.appendChild(p);
  }else{
   recent.forEach(x=>{
    const item=document.createElement("div");item.className="item";
    const strong=document.createElement("strong");strong.textContent=labels[x.resource_type]||"Learning Activity";
    const small=document.createElement("small");small.textContent=(x.resource_path||"Resource")+" · "+(x.status==="completed"?"Completed":"In progress")+" · "+(x.updated_at?new Date(x.updated_at).toLocaleString():"Date unavailable");
    item.append(strong,small);activity.appendChild(item);
   });
  }
  const btn=document.createElement("a");btn.className="btn";btn.href="/mind-tests/";btn.textContent="Explore Mind Tests";activity.appendChild(btn);app.appendChild(activity);
 }catch(e){
  console.warn(e);app.className="hero state";app.innerHTML='<h1>My Progress</h1><p>We could not load your progress right now. Please try again.</p><a class="btn" href="/member/dashboard/">Back to Dashboard</a>';
 }
})();
</script>
</body>
</html>

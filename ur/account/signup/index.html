<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>اکاؤنٹ بنائیں | Obaid Doctrine</title><link rel="stylesheet" href="../../styles.css?v=20260929"><style>body{background:#fafaf5;color:#31543a}.box{max-width:520px;margin:6vh auto;padding:28px 18px}.card{background:#fff;border:1px solid #dce8b5;border-radius:24px;padding:28px}label{display:block;font-weight:700;margin:14px 0 6px}input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd8cc;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#31543a;color:#fff;font-weight:800;font:inherit}.msg{margin-top:14px;padding:10px;border-radius:10px;background:#dce8b5}a{color:#31543a}</style></head><body><main class="box"><div class="card"><p><strong>OBAID DOCTRINE</strong></p><h1>اکاؤنٹ بنائیں</h1><form id="f"><label>نام</label><input id="name" autocomplete="name" required maxlength="80"><label>ای میل</label><input id="email" type="email" autocomplete="email" required><label>پاس ورڈ</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label>پاس ورڈ دوبارہ لکھیں</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" required><label>زبان</label><select id="language"><option value="ur">اردو</option><option value="en">English</option></select><label><input id="terms" type="checkbox" required style="width:auto"> میں <a href="/terms-and-conditions/">شرائط</a> اور <a href="/privacy-policy/">پرائیویسی پالیسی</a> سے اتفاق کرتا/کرتی ہوں۔</label><button>اکاؤنٹ بنائیں</button></form><div id="msg" class="msg" hidden></div><p>پہلے سے اکاؤنٹ ہے؟ <a href="/ur/account/login/">لاگ اِن کریں</a></p></div></main><script src="/account/auth.js?v=20260930"></script><script>(async()=>{document.getElementById("f").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");const form=document.getElementById("f");const passwordEl=form.elements.namedItem("password");const confirmEl=form.elements.namedItem("confirm");const emailEl=form.elements.namedItem("email");const nameEl=form.elements.namedItem("name");const languageEl=form.elements.namedItem("language");const submitButton=form.querySelector("button");const matchStatus=document.createElement("small");matchStatus.style.display="block";matchStatus.style.marginTop="8px";matchStatus.setAttribute("aria-live","polite");confirmEl.insertAdjacentElement("afterend",matchStatus);function updateMatch(){if(!confirmEl.value){matchStatus.textContent="";return}const same=passwordEl.value===confirmEl.value;matchStatus.textContent=same?"پاس ورڈ ایک جیسے ہیں۔":"پاس ورڈ ایک جیسے نہیں ہیں۔";matchStatus.style.color=same?"#31543a":"#8a3d2f"}passwordEl.addEventListener("input",updateMatch);confirmEl.addEventListener("input",updateMatch);if(passwordEl.value||confirmEl.value)updateMatch();if(passwordEl.value!==confirmEl.value){m.textContent="دونوں پاس ورڈ ایک جیسے ہونے چاہئیں۔";m.hidden=false;confirmEl.focus();return}const db=await ODAuth.client();const r=await db.auth.signUp({email:emailEl.value.trim(),password:passwordEl.value,options:{data:{display_name:nameEl.value.trim(),preferred_language:languageEl.value}}});if(r.error){m.textContent=r.error.message||"اکاؤنٹ نہیں بن سکا۔ اپنی معلومات چیک کریں۔";m.hidden=false;return}m.textContent=r.data.session?"اکاؤنٹ بن گیا۔":"اکاؤنٹ بن گیا۔ تصدیق کے لیے اپنی ای میل چیک کریں۔";m.hidden=false;document.getElementById("f").reset()}})()</script></body></html>

<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>لاگ اِن | Obaid Doctrine</title><link rel="stylesheet" href="../../styles.css?v=20260929"><style>body{background:#fafaf5;color:#31543a}.box{max-width:520px;margin:8vh auto;padding:28px 18px}.card{background:#fff;border:1px solid #dce8b5;border-radius:24px;padding:28px}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd8cc;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#31543a;color:#fff;font-weight:800;font:inherit}.links{margin-top:18px;text-align:center}.links a{color:#31543a}.msg{margin-top:14px;padding:10px;border-radius:10px;background:#dce8b5}</style></head><body><main class="box"><div class="card"><p><strong>OBAID DOCTRINE</strong></p><h1>خوش آمدید</h1><form id="f"><label>ای میل</label><input id="email" type="email" autocomplete="email" required><label>پاس ورڈ</label><input id="password" type="password" autocomplete="current-password" required><button>لاگ اِن کریں</button></form><div id="msg" class="msg" hidden></div><div class="links"><a href="/ur/account/forgot-password/">پاس ورڈ بھول گئے؟</a> · <a href="/ur/account/signup/">اکاؤنٹ بنائیں</a><br><br><a href="/account/login/">English</a></div></div></main><script src="/account/auth.js?v=20260929"></script><script>(async()=>{const s=await ODAuth.session();if(s)location.href="/ur/member/dashboard/";document.getElementById("f").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");m.hidden=true;const db=await ODAuth.client();const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){m.textContent="لاگ اِن ناکام رہا۔ ای میل اور پاس ورڈ چیک کریں۔";m.hidden=false;return}location.href="/ur/member/dashboard/"}})()</script></body></html>

<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>نیا پاس ورڈ | Obaid Doctrine</title><link rel="stylesheet" href="../../styles.css?v=20260929"><style>body{background:#fafaf5;color:#31543a}.box{max-width:520px;margin:8vh auto;padding:28px 18px}.card{background:#fff;border:1px solid #dce8b5;border-radius:24px;padding:28px}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd8cc;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#31543a;color:#fff;font-weight:800;font:inherit}.msg{margin-top:14px;padding:10px;border-radius:10px;background:#dce8b5}</style></head><body><main class="box"><div class="card"><p><strong>OBAID DOCTRINE</strong></p><h1>نیا پاس ورڈ مقرر کریں</h1><form id="f"><label>نیا پاس ورڈ</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label>پاس ورڈ دوبارہ لکھیں</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button>پاس ورڈ اپ ڈیٹ کریں</button></form><div id="msg" class="msg" hidden></div></div></main><script src="/account/firebase-auth.js?v=20261002"></script><script>(async()=>{const m=document.getElementById("msg"),form=document.getElementById("f"),code=new URLSearchParams(location.search).get("oobCode")||new URLSearchParams(location.hash.replace(/^#/,"")).get("oobCode");if(!code){m.textContent="یہ پاس ورڈ ری سیٹ لنک موجود نہیں یا غلط ہے۔";m.hidden=false;form.hidden=true;return}try{await ODFirebaseAuth.verifyResetCode(code)}catch(e){m.textContent="یہ پاس ورڈ ری سیٹ لنک غلط یا ختم ہو چکا ہے۔";m.hidden=false;form.hidden=true;return}form.onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value){m.textContent="دونوں پاس ورڈ ایک جیسے ہونے چاہئیں۔";m.hidden=false;return}try{await ODFirebaseAuth.confirmReset(code,password.value);m.textContent="پاس ورڈ کامیابی سے اپ ڈیٹ ہو گیا۔ اب آپ لاگ اِن کر سکتے ہیں۔";m.hidden=false;setTimeout(()=>location.href="/ur/account/login/",1200)}catch(e){m.textContent="پاس ورڈ اپ ڈیٹ نہیں ہو سکا۔ نئی ری سیٹ ای میل طلب کریں۔";m.hidden=false}}})()</script></body></html>

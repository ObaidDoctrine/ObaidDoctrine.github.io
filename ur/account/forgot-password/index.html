<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>پاس ورڈ ری سیٹ | Obaid Doctrine</title><link rel="stylesheet" href="../../styles.css?v=20260929"><style>body{background:#fafaf5;color:#31543a}.box{max-width:520px;margin:8vh auto;padding:28px 18px}.card{background:#fff;border:1px solid #dce8b5;border-radius:24px;padding:28px}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd8cc;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#31543a;color:#fff;font-weight:800;font:inherit}.msg{margin-top:14px;padding:10px;border-radius:10px;background:#dce8b5}a{color:#31543a}</style></head><body><main class="box"><div class="card"><p><strong>OBAID DOCTRINE</strong></p><h1>پاس ورڈ ری سیٹ کریں</h1><form id="f"><label>ای میل</label><input id="email" type="email" autocomplete="email" required><button>ری سیٹ ای میل بھیجیں</button></form><div id="msg" class="msg" hidden></div><p><a href="/ur/account/login/">لاگ اِن پر واپس جائیں</a></p></div></main><script src="/account/auth.js?v=20260929"></script><script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");const db=await ODAuth.client();const r=await db.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:location.origin+"/ur/account/reset-password/"});m.textContent=r.error?"ری سیٹ ای میل نہیں بھیجی جا سکی۔ دوبارہ کوشش کریں۔":"اگر اس ای میل سے اکاؤنٹ موجود ہے تو پاس ورڈ ری سیٹ کا پیغام بھیج دیا گیا ہے۔";m.hidden=false}</script></body></html>

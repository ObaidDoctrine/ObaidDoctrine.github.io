<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>میری لائبریری | Obaid Doctrine</title><link rel="canonical" href="https://www.obaiddoctrine.com/ur/member/library/"><style>body{margin:0;background:#fafaf5;color:#31543a;font-family:system-ui,-apple-system,"Noto Nastaliq Urdu",sans-serif}.wrap{max-width:980px;margin:auto;padding:32px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.brand{font-weight:800}.top a,a{color:#31543a;font-weight:700}.card{background:#fff;border:1px solid #dce8b5;border-radius:22px;padding:24px;margin:14px 0}.item{display:flex;justify-content:space-between;gap:18px;align-items:center;border-top:1px solid #e8eedb;padding:16px 0}.item:first-child{border-top:0}.path{font-size:.9rem;color:#6f756f;word-break:break-word}.btn{border:0;border-radius:10px;padding:10px 14px;background:#31543a;color:#fff;font-weight:800;cursor:pointer}@media(max-width:650px){.item{align-items:flex-start;flex-direction:column}.btn{width:100%}}</style></head><body><main class="wrap"><header class="top"><div class="brand">OBAID DOCTRINE</div><nav><a href="/ur/member/dashboard/">ڈیش بورڈ</a> · <a href="/ur/member/profile/">پروفائل</a></nav></header><section id="app" class="card"><h1>میری لائبریری</h1><p>آپ کے محفوظ کیے گئے مضامین لوڈ ہو رہے ہیں…</p></section></main><script src="/ur/member/member-auth.js?v=20260929"></script><script>(async()=>{const app=document.getElementById("app");function esc(v){return String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}try{const s=await ODMember.requireSession();if(!s)return;const db=await ODMember.client(),r=await db.from("saved_articles").select("id,article_path,created_at").order("created_at",{ascending:false});if(r.error)throw r.error;if(!r.data.length){app.innerHTML='<h1>میری لائبریری</h1><p>آپ نے ابھی کوئی مضمون محفوظ نہیں کیا۔</p><a href="/ur/">مضامین دیکھیں</a>';return}app.innerHTML='<h1>میری لائبریری</h1><p>بعد میں پڑھنے کے لیے محفوظ کیے گئے مضامین۔</p>'+r.data.map(x=>'<article class="item"><div><h2>'+esc(x.article_path)+'</h2><div class="path">'+esc(x.article_path)+'</div></div><div><a class="btn" href="'+encodeURI(x.article_path)+'">کھولیں</a> <button class="btn" data-id="'+x.id+'">حذف کریں</button></div></article>').join("");app.querySelectorAll("button[data-id]").forEach(b=>b.onclick=async()=>{b.disabled=true;const d=await db.from("saved_articles").delete().eq("id",b.dataset.id);if(d.error){b.disabled=false;alert("مضمون حذف نہیں ہو سکا۔");return}location.reload()})}catch(e){console.warn(e);app.innerHTML='<h1>میری لائبریری</h1><p>محفوظ مضامین لوڈ نہیں ہو سکے۔ دوبارہ کوشش کریں۔</p>'}})()</script></body></html>

<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ممبر نالج | Obaid Doctrine</title><style>body{margin:0;background:#fafaf5;color:#31543a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px 18px 70px}.top{margin-bottom:25px}.card{background:#fff;border:1px solid #dce8b5;border-radius:20px;padding:22px;margin:16px 0}.muted{color:#6f756f}.section h2{margin-bottom:8px}.source{display:block;color:#31543a;margin:8px 0}.btn{border:0;border-radius:12px;padding:12px 16px;background:#31543a;color:#fff;font-weight:800;cursor:pointer}.note{background:#dce8b5}.error{text-align:center;padding:45px 18px}</style></head><body><main class="wrap"><header class="top"><strong>OBAID DOCTRINE</strong></header><div id="app" class="card"><p>علم لوڈ ہو رہا ہے…</p></div></main><script src="/member/member-auth.js?v=20260929"></script><script src="/member/member-nav.js?v=20260929"></script><script src="/member/progress/progress-tracker.js?v=20260929"></script><script src="/member/analytics.js?v=20260929"></script><script>
(async()=>{const app=document.getElementById("app");try{const s=await ODMember.requireSession();if(!s)return;const slug=new URLSearchParams(location.search).get("slug");if(!slug||!/^[a-z0-9-]{2,100}$/.test(slug))throw Error("invalid");const db=await ODMember.client();const r=await db.from("member_content").select("slug,category,title,summary,content,sources").eq("slug",slug).eq("language","ur").eq("is_published",true).maybeSingle();if(r.error)throw r.error;if(!r.data)throw Error("notfound");const x=r.data,c=x.content||{},esc=v=>String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));const list=a=>Array.isArray(a)?a.map(v=>"<li>"+esc(v)+"</li>").join(""):"";app.innerHTML="<div class='note card'><div class='muted'>"+esc(x.category.replaceAll("-"," "))+"</div><h1>"+esc(x.title)+"</h1><p>"+esc(x.summary)+"</p></div><section class='card section'><h2>اہمیت</h2><p>"+esc(c.why_it_matters)+"</p></section><section class='card section'><h2>شواہد</h2><p>"+esc(c.evidence)+"</p></section><section class='card section'><h2>حدود</h2><p>"+esc(c.limitations)+"</p></section><section class='card section'><h2>عام غلط فہمیاں</h2><ul>"+list(c.misconceptions)+"</ul></section><section class='card section'><h2>غور و فکر</h2><p>"+esc(c.reflection_prompt)+"</p></section><section class='card section'><h2>عملی مشق</h2><p>"+esc(c.practice)+"</p></section><section class='card section'><h2>ذرائع</h2>"+(Array.isArray(x.sources)?x.sources.map(s=>"<a class='source' target='_blank' rel='noopener noreferrer' href='"+esc(s.url)+"'>"+esc(s.title)+"</a>").join(""):"")+"</section><section class='card'><button id='done' class='btn'>مکمل قرار دیں</button><p id='status' class='muted'></p></section>";document.getElementById("done").onclick=async()=>{const b=document.getElementById("done");b.disabled=true;const r=await ODProgress.complete("member_content",location.pathname+location.search);document.getElementById("status").textContent=r.saved?"مکمل کر دیا گیا اور پیش رفت میں شامل ہے۔":"اس وقت پیش رفت محفوظ نہیں ہو سکی۔";b.disabled=false};}catch(e){console.warn(e);app.className="card error";app.innerHTML="<h1>علم دستیاب نہیں</h1><p>یہ علمی مواد اس وقت لوڈ نہیں ہو سکا۔</p><a href='/member/knowledge/'>ممبر نالج پر واپس جائیں</a>"}})();
</script></body></html>

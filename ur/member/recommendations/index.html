<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>آپ کے لیے تجاویز | Obaid Doctrine</title><style>body{margin:0;background:#fafaf5;color:#31543a;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px 70px}.top{margin-bottom:24px}.brand{font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #dce8b5;border-radius:20px;padding:20px}.muted{color:#6f756f}.btn{display:inline-block;margin-top:12px;background:#31543a;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:800}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div class="brand">OBAID DOCTRINE</div></header><h1>آپ کے لیے تجاویز</h1><p class="muted">یہ تجاویز صرف پلیٹ فارم پر آپ کی سرگرمی، مثلاً مکمل ٹیسٹس، محفوظ مضامین اور سیکھنے کے راستوں کی بنیاد پر ہیں۔ یہ نفسیاتی تشخیص نہیں ہیں۔</p><div id="status" class="muted">تجاویز لوڈ ہو رہی ہیں…</div><div id="grid" class="grid"></div></main><script src="/member/member-auth.js?v=20260929"></script><script src="/member/member-nav.js?v=20260929"></script><script>(async()=>{if(!await ODMember.requireSession())return;const db=await ODMember.client(),s=await ODMember.session(),u=s.user;const [t,p,a]=await Promise.all([db.from("test_results").select("test_id,completed_at").eq("user_id",u.id).order("completed_at",{ascending:false}),db.from("learning_progress").select("resource_type,resource_path,updated_at").eq("user_id",u.id).order("updated_at",{ascending:false}),db.from("saved_articles").select("article_path,created_at").eq("user_id",u.id).order("created_at",{ascending:false})]);if(t.error||p.error||a.error){document.getElementById("status").textContent="تجاویز فی الحال دستیاب نہیں ہیں۔";return}const testIds=new Set((t.data||[]).map(x=>x.test_id));const paths=new Set((p.data||[]).map(x=>x.resource_path));const knowledgePaths=new Set((p.data||[]).filter(x=>x.resource_type==="member_content").map(x=>x.resource_path));const rec=[];const add=(title,desc,href)=>{if(rec.length<6)rec.push({title,desc,href})};if(!testIds.has("emotional-intelligence"))add("جذباتی ذہانت","جذباتی آگاہی اور ردعمل پر غور کے لیے ٹیسٹ دیکھیں۔","/mind-tests/emotional-intelligence/");if(!testIds.has("communication-style"))add("گفتگو کا انداز","گفتگو کے انداز اور روزمرہ تعاملات پر غور کریں۔","/mind-tests/communication-style/");if(!paths.has("/member/learning-paths/?path=communication"))add("بہتر گفتگو","سننے، وضاحت اور باعزت ردعمل پر مبنی تعلیمی راستہ جاری رکھیں۔","/member/learning-paths/?path=communication");if(!paths.has("/member/learning-paths/?path=decisions"))add("بہتر فیصلے","حقائق، اندازوں، اختیارات اور نتائج کے لیے عملی فریم ورک استعمال کریں۔","/member/learning-paths/?path=decisions");if((a.data||[]).length) add("آپ کی لائبریری","اپنے محفوظ کیے گئے مضامین کی طرف واپس جائیں۔","/member/library/");if(!knowledgePaths.has("/ur/member/knowledge/article/?slug=self-awareness-foundation"))add("ممبر نالج","تحقیق پر مبنی علمی مواد پڑھیں، غور و فکر کریں اور مکمل کر کے پیش رفت میں شامل کریں۔","/ur/member/knowledge/article/?slug=self-awareness-foundation");if(!rec.length)add("سیکھنا جاری رکھیں","اپنی پیش رفت دیکھیں اور اگلی تعلیمی سرگرمی منتخب کریں۔","/member/progress/");document.getElementById("grid").innerHTML=rec.map(x=>'<article class="card"><h2>'+x.title+'</h2><p class="muted">'+x.desc+'</p><a class="btn" href="'+x.href+'">کھولیں</a></article>').join("");document.getElementById("status").textContent="یہ تجاویز پلیٹ فارم کی سرگرمی دکھاتی ہیں، کسی نفسیاتی خصوصیت کا اندازہ نہیں۔";})()</script></body></html>

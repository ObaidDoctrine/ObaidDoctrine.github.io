<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>سیکھنے کے راستے | Obaid Doctrine</title><style>body{margin:0;background:#fafaf5;color:#31543a;font-family:system-ui,-apple-system,"Noto Nastaliq Urdu",sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px 70px}.top{margin-bottom:25px}.brand{font-weight:800}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #dce8b5;border-radius:20px;padding:22px}.tag{display:inline-block;background:#dce8b5;border-radius:99px;padding:5px 9px;font-size:.8rem;font-weight:700}.btn{display:inline-block;margin-top:14px;background:#31543a;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px;font-weight:800;border:0}.step{padding:13px 0;border-bottom:1px solid #dce8b5}.muted{color:#6f756f}.notice{margin:18px 0;padding:12px;background:#dce8b5;border-radius:12px}@media(max-width:750px){.grid{grid-template-columns:1fr}}a{color:#31543a}</style></head><body><main class="wrap"><header class="top"><div class="brand">OBAID DOCTRINE</div></header><section id="app"></section></main><script src="/ur/member/member-auth.js?v=20260929"></script><script src="/member/member-nav.js?v=20260929"></script><script src="/member/learning-paths/learning-path.js?v=20260929"></script><script>(async()=>{if(!await ODMember.requireSession())return;const paths={self:{title:"خود کو سمجھنا",desc:"خود آگاہی، غور و فکر اور تعلیمی نفسیاتی تصورات کے ذریعے اپنی سمجھ بہتر کریں۔",steps:["اپنی توجہ، عادات اور ردعمل کے نمونوں کو نوٹ کریں۔","مائنڈ ٹیسٹ کو تشخیصی آلہ نہیں بلکہ غور و فکر کے سوالات کے طور پر استعمال کریں۔","اپنے نجی جرنل میں ایک مشاہدہ لکھیں۔","جو سیکھا اسے دیکھیں اور ایک چھوٹی عملی عادت منتخب کریں۔"]},communication:{title:"بہتر گفتگو",desc:"سننے، وضاحت، حدود اور باعزت ردعمل کے ذریعے روزمرہ تعلقات میں گفتگو بہتر کریں۔",steps:["سننے اور جواب تیار کرنے کے فرق کو سمجھیں۔","ایک واضح اور باعزت درخواست کی مشق کریں۔","حالیہ گفتگو پر الزام کے بغیر غور کریں۔","اس ہفتے ایک communication habit کی مشق کریں۔"]},decisions:{title:"بہتر فیصلے",desc:"واضح انتخاب، ترجیحات اور نتائج پر غور کے لیے ایک سادہ تعلیمی فریم ورک سیکھیں۔",steps:["فیصلہ اور اہم ترجیحات واضح کریں۔","حقائق، اندازوں اور نامعلوم چیزوں کو الگ کریں۔","اختیارات اور ممکنہ trade-offs کا موازنہ کریں۔","نتیجہ نوٹ کریں اور دیکھیں کہ آپ نے کیا سیکھا۔"]}};const key=new URLSearchParams(location.search).get("path");const p=paths[key];const app=document.getElementById("app");if(!p){app.innerHTML='<h1>سیکھنے کے راستے</h1><p class="muted">علم، غور و فکر اور عملی مشق کے لیے منظم تعلیمی سفر۔</p><div class="grid">'+Object.entries(paths).map(([k,v])=>'<article class="card"><span class="tag">تعلیمی راستہ</span><h2>'+v.title+'</h2><p class="muted">'+v.desc+'</p><a class="btn" href="?path='+k+'">راستہ کھولیں</a></article>').join("")+'</div>';return}app.innerHTML='<article class="card"><span class="tag">سیکھنے کا راستہ</span><h1>'+p.title+'</h1><p class="muted">'+p.desc+'</p><div class="notice">یہ راستہ سیکھنے اور غور و فکر کی سرگرمیوں کو سپورٹ کرتا ہے۔ یہ نفسیاتی صحت کا جائزہ یا کسی بیماری کی تشخیص نہیں کرتا۔</div>'+p.steps.map((s,i)=>'<div class="step"><strong>مرحلہ '+(i+1)+'</strong><div>'+s+'</div></div>').join("")+'<button id="start" class="btn" type="button">پیش رفت شروع کریں</button> <button id="done" class="btn" type="button">راستہ مکمل کریں</button><p id="msg" class="muted"></p><p><a href="/ur/member/learning-paths/">← تمام راستے</a></p></article>';document.getElementById("start").onclick=async()=>{document.getElementById("msg").textContent=await ODLearningPath.start("/ur/member/learning-paths/?path="+key)?"پیش رفت محفوظ ہو گئی۔":"پیش رفت محفوظ نہیں ہو سکی۔"};document.getElementById("done").onclick=async()=>{document.getElementById("msg").textContent=await ODLearningPath.complete("/ur/member/learning-paths/?path="+key)?"راستہ مکمل ہو گیا۔":"تکمیل محفوظ نہیں ہو سکی۔"}})()</script></body></html>

<html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>میری پیش رفت | Obaid Doctrine</title><link rel="canonical" href="https://www.obaiddoctrine.com/ur/member/progress/"><style>
body{margin:0;background:#fafaf5;color:#31543a;font-family:system-ui,-apple-system,"Noto Nastaliq Urdu",sans-serif}.wrap{max-width:1050px;margin:auto;padding:30px 18px 70px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:25px}.brand{font-weight:800;letter-spacing:.04em}.top a{color:#31543a;font-weight:700}.hero,.card{background:#fff;border:1px solid rgba(49,84,58,.12);border-radius:22px;padding:24px;box-shadow:0 8px 28px rgba(49,84,58,.06)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}.num{font-size:2rem;font-weight:800;margin-top:6px}.muted{color:#6f756f}.activity{margin-top:16px}.item{padding:15px 0;border-bottom:1px solid #dce8b5}.item:last-child{border-bottom:0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#dce8b5;font-weight:700;font-size:.85rem}.btn{display:inline-block;margin-top:14px;padding:11px 15px;border-radius:11px;background:#31543a;color:#fff;text-decoration:none;font-weight:800}.state{text-align:center;padding:50px 20px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">OBAID DOCTRINE</div><a href="/ur/member/dashboard/">ڈیش بورڈ</a></header><section id="app" class="hero state"><h1>میری پیش رفت</h1><p>آپ کی سیکھنے کی سرگرمی لوڈ ہو رہی ہے…</p></section></main><script src="/ur/member/member-auth.js?v=20260929"></script><script>
(async()=>{const app=document.getElementById("app");try{const session=await ODMember.requireSession();if(!session)return;const db=await ODMember.client();const r=await db.from("learning_progress").select("resource_type,resource_path,status,completed_at,updated_at").order("updated_at",{ascending:false});if(r.error)throw r.error;const rows=r.data||[];const counts={article:0,test:0,learning_path:0};rows.forEach(x=>{if(x.status==="completed"&&counts[x.resource_type]!=null)counts[x.resource_type]++});const total=counts.article+counts.test+counts.learning_path;const stage=total===0?"آغاز":total<3?"سیکھنا":total<7?"مشق":"نشوونما";app.className="";app.innerHTML='<div class="hero"><h1>میری پیش رفت</h1><p class="muted">یہ پیش رفت Obaid Doctrine پر آپ کی سرگرمی کو ظاہر کرتی ہے۔ یہ نفسیاتی تشخیص یا ذاتی حیثیت نہیں ہے۔</p><div class="grid"><div class="card"><div class="muted">مکمل مضامین</div><div class="num">'+counts.article+'</div></div><div class="card"><div class="muted">مکمل ٹیسٹس</div><div class="num">'+counts.test+'</div></div><div class="card"><div class="muted">Learning Paths</div><div class="num">'+counts.learning_path+'</div></div><div class="card"><div class="muted">کل سرگرمیاں</div><div class="num">'+total+'</div><div class="pill">'+stage+'</div></div></div></div><section class="card activity"><h2>حالیہ سرگرمی</h2>'+(rows.length?rows.slice(0,10).map(x=>'<div class="item"><strong>'+({article:"مضمون",test:"مائنڈ ٹیسٹ",learning_path:"Learning Path"}[x.resource_type]||"سرگرمی")+'</strong><div class="muted">'+x.resource_path+' · '+new Date(x.updated_at).toLocaleString()+'</div></div>').join(""):'<p class="muted">ابھی کوئی پیش رفت محفوظ نہیں ہوئی۔ لاگ اِن ہو کر مائنڈ ٹیسٹ مکمل کریں یا مضمون کو مکمل قرار دیں۔')+'<a class="btn" href="/ur/mind-tests/">مائنڈ ٹیسٹس دیکھیں</a></section>';}catch(e){console.warn(e);app.innerHTML='<h1>میری پیش رفت</h1><p>آپ کی پیش رفت ابھی لوڈ نہیں ہو سکی۔ دوبارہ کوشش کریں۔</p><a class="btn" href="/ur/member/dashboard/">ڈیش بورڈ پر واپس جائیں</a>'}})();
</script></body></html>

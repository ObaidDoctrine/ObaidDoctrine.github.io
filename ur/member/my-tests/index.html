ng:19px}.dims{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div class="brand">OBAID DOCTRINE</div><nav><a href="/ur/member/dashboard/">ڈیش بورڈ</a> &nbsp; <a href="/ur/mind-tests/">مائنڈ ٹیسٹس</a></nav></header><section id="app" class="hero state"><h1>میرے مائنڈ ٹیسٹس</h1><p class="meta">آپ کے نجی ٹیسٹ نتائج لوڈ ہو رہے ہیں…</p></section></main><script src="/member/member-auth.js?v=20261002"></script><script>(function(){"use strict";const app=document.getElementById("app");const names={"emotional-intelligence":"جذباتی ذہانت","communication-style":"ابلاغی انداز","self-awareness":"خود آگاہی","conflict-style":"تنازع سے نمٹنے کا انداز","motivation-goals":"حوصلہ اور اہداف","stress-response":"تناؤ سے نمٹنے کا انداز","resilience-adaptability":"لچک اور موافقت","decision-making-style":"فیصلہ سازی کا انداز","relationship-communication":"تعلقات میں ابلاغ","personality-traits":"شخصیت کی خصوصیات"};const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function renderDims(value){if(!value||typeof value!=="object")return "";const entries=Object.entries(value).filter(([k,v])=>v!==null&&v!==undefined&&v!=="");if(!entries.length)return "";return '<div class="dims">'+entries.map(([k,v])=>'<div class="dim"><strong>'+esc(k.replace(/[_-]+/g," "))+'</strong><span>'+esc(v)+'</span></div>').join("")+'</div>'}(async()=>{try{const session=await ODMember.requireSession();if(!session)return;const db=await ODMember.client();const userResult=await db.auth.getUser();if(userResult.error||!userResult.data.user)throw(userResult.error||new Error("User verification failed."));const uid=userResult.data.user.id;const {data,error}=await db.from("test_results").select("test_id,test_version,language,question_count,strongest_dimension,strongest_label,strongest_description,score,dimension_scores,completed_at").eq("user_id",uid).order("completed_at",{ascending:false}).limit(50);if(error)throw error;if(!data||!data.length){app.className="hero state";app.innerHTML='<h1>میرے مائنڈ ٹیسٹس</h1><p>ابھی آپ کا کوئی ٹیسٹ نتیجہ محفوظ نہیں ہے۔ لاگ اِن رہتے ہوئے مائنڈ ٹیسٹ مکمل کریں، نتیجہ یہاں نظر آئے گا۔</p><a class="btn" href="/ur/mind-tests/">مائنڈ ٹیسٹس دیکھیں</a>';return}app.className="";const head=document.createElement("section");head.className="hero";head.innerHTML='<h1>میرے مائنڈ ٹیسٹس</h1><p class="meta">آپ کے محفوظ شدہ خود شناسی نتائج۔ یہ تعلیمی ٹولز ہیں، طبی تشخیص نہیں۔</p><div class="notice">یہ نتائج ذاتی غور و فکر کے ریکارڈ ہیں۔ انہیں کسی ذہنی صحت کی حالت کی تشخیص یا پیشہ ورانہ جائزے کے متبادل کے طور پر استعمال نہیں کرنا چاہیے۔</div>';app.appendChild(head);data.forEach(x=>{const card=document.createElement("article");card.className="test";const label=names[x.test_id]||x.test_id||"مائنڈ ٹیسٹ";const lang=x.language==="ur"?"اردو":"English";const date=x.completed_at?new Date(x.completed_at).toLocaleString():"تاریخ دستیاب نہیں";card.innerHTML='<h2>'+esc(label)+'</h2><div class="meta">'+esc(date)+' · '+esc(lang)+(x.test_version?" · ورژن "+esc(x.test_version):"")+'</div><div class="score">اسکور: '+esc(x.score??"—")+' / 50</div><div class="badges"><span class="badge">'+esc(x.strongest_label||"خود شناسی نتیجہ")+'</span></div>'+(x.strongest_description?'<p>'+esc(x.strongest_description)+'</p>':"")+renderDims(x.dimension_scores);app.appendChild(card)})}catch(e){console.warn(e);app.className="hero state";app.innerHTML='<h1>میرے مائنڈ ٹیسٹس</h1><p>آپ کی تاریخ ابھی لوڈ نہیں ہو سکی۔ دوبارہ کوشش کریں۔</p><a class="btn" href="/ur/member/dashboard/">ڈیش بورڈ پر واپس جائیں</a>}})()})();</script><script src="/member/member-nav.js?v=20260929"></script></body></html>

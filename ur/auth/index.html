<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اکاؤنٹ | OBAID DOCTRINE</title>
<meta name="description" content="اپنے OBAID DOCTRINE اکاؤنٹ میں لاگ اِن کریں۔">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://www.obaiddoctrine.com/auth/">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="stylesheet" href="/styles.css?v=ultra-editorial-20261003">
<style>
.auth-page{min-height:100vh;background:#FAFAF5;color:#173D2A}
.auth-wrap{width:min(92%,520px);margin:0 auto;padding:70px 0}
.auth-card{background:#fff;border:1px solid rgba(23,61,42,.14);border-radius:28px;padding:32px;box-shadow:0 12px 35px rgba(23,61,42,.08)}
.auth-brand{font-weight:900;letter-spacing:.08em;color:#173D2A;text-decoration:none}
.auth-card h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1;letter-spacing:-.05em;margin:28px 0 10px}
.auth-card p{color:#6F756F;line-height:1.6}
.auth-field{display:grid;gap:7px;margin:18px 0}
.auth-field label{font-size:12px;font-weight:800;letter-spacing:.08em;color:#496B50}
.auth-field input{width:100%;box-sizing:border-box;padding:14px 15px;border:1px solid rgba(23,61,42,.18);border-radius:12px;background:#FAFAF5;color:#173D2A;font:inherit}
.auth-button{width:100%;padding:14px 18px;border:0;border-radius:12px;background:#173D2A;color:#fff;font-weight:800;cursor:pointer}
.auth-button:disabled{opacity:.55;cursor:wait}
.auth-secondary{margin-top:16px}
.auth-secondary a{color:#173D2A;font-weight:800}
.auth-status{min-height:24px;margin-top:18px;font-size:14px}
.auth-status[data-type="error"]{color:#8b2f2f}
.auth-status[data-type="success"]{color:#496B50}
.auth-session{padding:20px;border-radius:18px;background:#DCE8B5}
.auth-session strong{display:block;margin-bottom:8px}
[hidden]{display:none!important}
</style>
</head>
<body class="auth-page">
<main class="auth-wrap">
<a class="auth-brand" href="/">OBAID DOCTRINE</a>
<section class="auth-card" aria-labelledby="auth-title">
<h1 id="auth-title">آپ کا اکاؤنٹ</h1>
<p>ایک بار لاگ اِن کریں۔ آپ کا Nhost سیشن محفوظ رہے گا، دوبارہ آنے پر بحال ہوگا اور ضرورت کے مطابق خودکار طور پر ریفریش ہوگا۔</p>

<div id="login-panel">
<form id="login-form" novalidate>
<div class="auth-field">
<label for="email">ای میل</label>
<input id="email" name="email" type="email" autocomplete="username" required>
</div>
<div class="auth-field">
<label for="password">پاس ورڈ</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
</div>
<button id="login-button" class="auth-button" type="submit">لاگ اِن</button>
</form>
</div>

<div id="session-panel" class="auth-session" hidden>
<strong>آپ لاگ اِن ہیں۔</strong>
<span id="user-email"></span>
<div class="auth-secondary"><button id="logout-button" class="auth-button" type="button">لاگ آؤٹ</button></div>
</div>

<div id="auth-status" class="auth-status" role="status" aria-live="polite">سیشن چیک ہو رہا ہے…</div>
<p class="auth-secondary"><a href="/">← OBAID DOCTRINE پر واپس جائیں</a></p>
</section>
</main>
<script type="module" src="/auth/auth.js"></script>
</body>
</html>

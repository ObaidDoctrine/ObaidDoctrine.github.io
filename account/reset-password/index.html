<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Set New Password | Obaid Doctrine</title><link rel="stylesheet" href="../../styles.css?v=20260929"><style>body{background:#fafaf5;color:#31543a}.box{max-width:520px;margin:8vh auto;padding:28px 18px}.card{background:#fff;border:1px solid #dce8b5;border-radius:24px;padding:28px}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd8cc;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#31543a;color:#fff;font-weight:800;font:inherit}.msg{margin-top:14px;padding:10px;border-radius:10px;background:#dce8b5}</style></head><body><main class="box"><div class="card"><p><strong>OBAID DOCTRINE</strong></p><h1>Set New Password</h1><form id="f"><label>New Password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label>Confirm Password</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button>Update Password</button></form><div id="msg" class="msg" hidden></div></div></main><script src="/account/firebase-auth.js?v=20261002"></script><script>(async()=>{const m=document.getElementById("msg"),form=document.getElementById("f"),code=new URLSearchParams(location.search).get("oobCode")||new URLSearchParams(location.hash.replace(/^#/,"")).get("oobCode");if(!code){m.textContent="This password reset link is missing or invalid.";m.hidden=false;form.hidden=true;return}try{await ODFirebaseAuth.verifyResetCode(code)}catch(e){m.textContent="This password reset link is invalid or expired.";m.hidden=false;form.hidden=true;return}form.onsubmit=async e=>{e.preventDefault();if(password.value!==confirm.value){m.textContent="Passwords do not match.";m.hidden=false;return}try{await ODFirebaseAuth.confirmReset(code,password.value);m.textContent="Password updated successfully. You can now log in.";m.hidden=false;setTimeout(()=>location.href="/account/login/",1200)}catch(e){m.textContent="We could not update your password. Please request a new reset email.";m.hidden=false}}})()</script></body></html>

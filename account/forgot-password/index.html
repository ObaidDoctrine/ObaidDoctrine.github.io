<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Forgot Password | Obaid Doctrine</title><link rel="stylesheet" href="../../styles.css?v=20260929"><style>body{background:#fafaf5;color:#31543a}.box{max-width:520px;margin:8vh auto;padding:28px 18px}.card{background:#fff;border:1px solid #dce8b5;border-radius:24px;padding:28px}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd8cc;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#31543a;color:#fff;font-weight:800;font:inherit}.msg{margin-top:14px;padding:10px;border-radius:10px;background:#dce8b5}a{color:#31543a}</style></head><body><main class="box"><div class="card"><p><strong>OBAID DOCTRINE</strong></p><h1>Reset Password</h1><form id="f"><label>Email</label><input id="email" type="email" autocomplete="email" required><button>Send Reset Email</button></form><div id="msg" class="msg" hidden></div><p><a href="/account/login/">Back to Log In</a></p></div></main><script src="/account/firebase-auth.js?v=20261002"></script><script src="/account/auth.js?v=20261002"></script><script>document.getElementById("f").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");try{await ODAuth.resetPassword(document.getElementById("email").value.trim());m.textContent="If an account exists for that email, a password reset message has been sent.";m.hidden=false}catch(error){m.textContent="We could not send the reset email. Please try again.";m.hidden=false}}</script></body></html>

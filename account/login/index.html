<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Log In | Obaid Doctrine</title><link rel="stylesheet" href="../../styles.css?v=20260929"><style>body{background:#fafaf5;color:#31543a}.box{max-width:520px;margin:8vh auto;padding:28px 18px}.card{background:#fff;border:1px solid #dce8b5;border-radius:24px;padding:28px;box-shadow:0 10px 30px rgba(49,84,58,.07)}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd8cc;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#31543a;color:#fff;font-weight:800;font:inherit}.links{margin-top:18px;text-align:center}.links a{color:#31543a}.msg{margin-top:14px;padding:10px;border-radius:10px;background:#dce8b5}h1{margin-top:0}</style></head><body><main class="box"><div class="card"><p><strong>OBAID DOCTRINE</strong></p><h1>Welcome Back</h1><form id="f"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">Log In</button></form><div id="msg" class="msg" hidden></div><div class="links"><a href="/account/forgot-password/">Forgot Password?</a> · <a href="/account/register/">Create Account</a><br><br><a href="/ur/account/login/">اردو</a></div></div></main><script src="/member/analytics.js?v=20260929"></script><script src="/account/firebase-auth.js?v=20261002"></script><script src="/account/auth.js?v=20261002"></script><script src="/member/backend-api.js?v=20261002"></script><script>(async()=>{const params=new URLSearchParams(location.search),nextRaw=params.get("next"),next=nextRaw&&nextRaw.startsWith("/")&&!nextRaw.startsWith("//")?nextRaw:"/member/dashboard/",msg=document.getElementById("msg"),form=document.getElementById("f"),email=document.getElementById("email"),password=document.getElementById("password"),submit=document.getElementById("submit");if(await ODAuth.user()){location.href=next;return}function friendly(error){const c=String(error?.code||"");if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))return "Email or password is incorrect. If you just created/reset the Firebase account, use that Firebase password.";if(c.includes("too-many-requests"))return "Too many attempts. Please wait a little and try again.";if(c.includes("network-request-failed"))return "Network error. Check your internet connection and try again.";return error?.message||"Login failed. Please try again."}form.onsubmit=async e=>{e.preventDefault();msg.hidden=true;submit.disabled=true;const address=email.value.trim().toLowerCase(),pass=password.value;try{await ODAuth.login(address,pass);await ODBackend.me();if(window.ODAnalytics)ODAnalytics.track("login",{method:"firebase-password"});location.href=next}catch(error){console.error("[OD Login]",error);msg.textContent=friendly(error);msg.hidden=false}finally{submit.disabled=false}}})()</script></body></html>

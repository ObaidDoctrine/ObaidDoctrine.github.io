<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Log In | Obaid Doctrine</title><link rel="stylesheet" href="../../styles.css?v=20260929"><style>body{background:#fafaf5;color:#31543a}.box{max-width:520px;margin:8vh auto;padding:28px 18px}.card{background:#fff;border:1px solid #dce8b5;border-radius:24px;padding:28px;box-shadow:0 10px 30px rgba(49,84,58,.07)}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #cfd8cc;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:11px;background:#31543a;color:#fff;font-weight:800;font:inherit}.links{margin-top:18px;text-align:center}.links a{color:#31543a}.msg{margin-top:14px;padding:10px;border-radius:10px;background:#dce8b5}h1{margin-top:0}</style></head><body><main class="box"><div class="card"><p><strong>OBAID DOCTRINE</strong></p><h1>Welcome Back</h1><form id="f"><label>Email</label><input id="email" type="email" autocomplete="email" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button>Log In</button></form><div id="msg" class="msg" hidden></div><div class="links"><a href="/account/forgot-password/">Forgot Password?</a> · <a href="/account/register/">Create Account</a><br><br><a href="/ur/account/login/">اردو</a></div></div></main><script src="/member/analytics.js?v=20260929"></script><script src="/account/auth.js?v=20260929"></script><script>(async()=>{const params=new URLSearchParams(location.search);const nextRaw=params.get("next");const next=nextRaw&&nextRaw.startsWith("/")&&!nextRaw.startsWith("//")?nextRaw:"/member/dashboard/";const msg=document.getElementById("msg");const form=document.getElementById("f");const emailInput=document.getElementById("email");const passwordInput=document.getElementById("password");const u=await ODAuth.user();if(u){location.href=next;return}form.onsubmit=async e=>{e.preventDefault();msg.hidden=true;const db=await ODAuth.client();const email=emailInput.value.trim();const r=await db.auth.signInWithPassword({email,password:passwordInput.value});if(r.error){msg.textContent=r.error.code==="email_not_confirmed"?"Your email is not confirmed yet. Please check your inbox or resend the confirmation email.":"Login failed. Please check your email and password.";msg.hidden=false;if(r.error.code==="email_not_confirmed"){const b=document.createElement("button");b.type="button";b.textContent="Resend confirmation email";b.style.marginTop="10px";b.onclick=async()=>{b.disabled=true;const rr=await db.auth.resend({type:"signup",email,options:{emailRedirectTo:location.origin+"/account/login/"}});msg.textContent=rr.error?rr.error.message:"Confirmation email requested. Please check your inbox and spam folder.";b.disabled=false};msg.appendChild(document.createElement("br"));msg.appendChild(b)}return}if(window.ODAnalytics)ODAnalytics.track("login",{method:"password"});location.href=next};})()</script></body></html>

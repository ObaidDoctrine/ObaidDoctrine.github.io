plugins {
    id "com.android.application"
}

android {
    namespace "com.obaiddoctrine.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.obaiddoctrine.app"
        minSdk 23
        targetSdk 36
        versionCode 3
        versionName "1.0.3"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}

plugins {
    id "com.android.application"
}

android {
    namespace "com.obaiddoctrine.app"
    compileSdk 36

    defaultConfig {
        applicationId "com.obaiddoctrine.app"
        minSdk 23
        targetSdk 36
        versionCode 5
        versionName "1.0.5"
    }

    signingConfigs {
        release {
            def storeFilePath = System.getenv("ANDROID_KEYSTORE_PATH")
            def storePasswordValue = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def keyAliasValue = System.getenv("ANDROID_KEY_ALIAS")
            def keyPasswordValue = System.getenv("ANDROID_KEY_PASSWORD")

            if (storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }
}


/*
 * Launcher icon source:
 * Reuse the canonical Obaid Doctrine brand asset from the website repo.
 * The image is copied into generated Android resources at build time so
 * the app and website keep the same branding without duplicating the binary.
 */
def launcherIconSource = file("$rootDir/../assets/brand-profile.png")
def generatedLauncherResDir = file("$buildDir/generated/res/launcherIcon")

android {
    sourceSets {
        main.res.srcDir(generatedLauncherResDir)
    }
}

tasks.register("prepareLauncherIcon") {
    inputs.file(launcherIconSource)
    outputs.dir(generatedLauncherResDir)

    doLast {
        if (!launcherIconSource.exists()) {
            throw new GradleException("Missing launcher icon source: $launcherIconSource")
        }

        def outputDir = file("$generatedLauncherResDir/drawable-nodpi")
        outputDir.mkdirs()

        copy {
            from launcherIconSource
            into outputDir
            rename { "brand_profile_source.png" }
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("prepareLauncherIcon")
}

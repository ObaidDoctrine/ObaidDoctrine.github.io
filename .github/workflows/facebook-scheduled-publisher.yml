name: Scheduled Facebook Publisher
on:
  schedule:
    - cron: "0 3,9,15 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Publish due Facebook content
        env:
          FB_PAGE_ID: "1021253154403079"
          FB_GRAPH_VERSION: "v26.0"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        shell: bash
        run: bash .github/scripts/publish-scheduled-facebook.sh

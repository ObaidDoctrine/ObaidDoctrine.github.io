name: Shell script syntax check

on:
  push:
    branches: ["main"]
    paths:
      - ".github/scripts/**/*.sh"
      - ".github/workflows/shell-script-check.yml"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/scripts/**/*.sh"
      - ".github/workflows/shell-script-check.yml"

permissions:
  contents: read

jobs:
  shell-syntax:
    name: Validate repository shell scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Run bash syntax checks
        shell: bash
        run: |
          set -euo pipefail
          find .github/scripts -type f -name '*.sh' -print0 | while IFS= read -r -d '' script; do
            echo "Checking $script"
            bash -n "$script"
          done

name: Obaid Doctrine SEO V2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/seo-v2-trigger'

permissions:
  contents: write

jobs:
  seo-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply SEO V2
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          from datetime import datetime, timezone

          ROOT=Path('.')
          BASE='https://obaiddoctrine.github.io'
          now=datetime.now(timezone.utc).strftime('%Y-%m-%d')

          # Remove Urdu hreflang from English pages where the equivalent Urdu page does not exist.
          for p in ROOT.rglob('*.html'):
              if '.git' in p.parts or p.as_posix() == 'ur/index.html':
                  continue
              t=p.read_text(encoding='utf-8')
              t=re.sub(r'\s*<link rel="alternate" hreflang="ur" href="https://obaiddoctrine\.github\.io/ur/[^\"]*">','',t)
              p.write_text(t,encoding='utf-8')

          # Add Article JSON-LD to article pages that do not already have it.
          articles=ROOT/'articles'
          for p in articles.glob('*/index.html'):
              if p.parent == articles: continue
              t=p.read_text(encoding='utf-8')
              if 'application/ld+json' in t: continue
              tm=re.search(r'<title>(.*?)</title>',t,re.I|re.S)
              cm=re.search(r'<link rel="canonical" href="([^"]+)"',t,re.I)
              dm=re.search(r'<meta name="description" content="([^"]*)"',t,re.I)
              if not tm or not cm: continue
              title=re.sub(r'\s+',' ',tm.group(1)).strip()
              canonical=cm.group(1)
              desc=dm.group(1).strip() if dm else ''
              schema={
                '@context':'https://schema.org',
                '@type':'Article',
                'headline':title,
                'description':desc,
                'author':{'@type':'Organization','name':'Obaid Doctrine','url':BASE+'/'},
                'dateModified':now,
                'mainEntityOfPage':{'@type':'WebPage','@id':canonical}
              }
              block='<script type="application/ld+json">\n'+json.dumps(schema,ensure_ascii=False,indent=2)+'\n</script>\n'
              t=t.replace('</head>',block+'</head>',1)
              p.write_text(t,encoding='utf-8')

          # Correct Open Graph type for non-article pages.
          for rel in ['articles/index.html','about/index.html','contact/index.html','psychology/index.html','human-behaviour/index.html','relationships/index.html','marriage-family/index.html','self-improvement/index.html','society-life/index.html','research-insights/index.html']:
              p=ROOT/rel
              if p.exists():
                  t=p.read_text(encoding='utf-8').replace('<meta property="og:type" content="article">','<meta property="og:type" content="website">')
                  p.write_text(t,encoding='utf-8')

          # Fix known placeholder homepage links when present.
          p=ROOT/'index.html'
          if p.exists():
              t=p.read_text(encoding='utf-8')
              mapping={
                'href="#">Read insight →':'href="/articles/how-habits-form/">Read insight →'
              }
              for a,b in mapping.items(): t=t.replace(a,b)
              p.write_text(t,encoding='utf-8')

          # Add Urdu homepage to sitemap.
          sm=ROOT/'sitemap.xml'
          if sm.exists():
              s=sm.read_text(encoding='utf-8')
              if BASE+'/ur/' not in s:
                  s=s.replace('</urlset>',f'<url><loc>{BASE}/ur/</loc></url></urlset>')
                  sm.write_text(s,encoding='utf-8')

          # Custom GitHub Pages 404.
          p404=ROOT/'404.html'
          if not p404.exists():
              p404.write_text('''<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Page Not Found | Obaid Doctrine</title><meta name="robots" content="noindex"><link rel="stylesheet" href="/styles.css"></head><body><main class="section" style="max-width:760px;margin:12vh auto;text-align:center"><p class="eyebrow">OBAID DOCTRINE</p><h1>Page not found.</h1><p class="lead">The page you requested does not exist or may have moved.</p><p><a class="btn primary" href="/">Return to Obaid Doctrine</a> <a class="btn ghost" href="/articles/">Browse Articles</a></p></main></body></html>''',encoding='utf-8')
          PY

      - name: Commit SEO V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Apply Obaid Doctrine SEO V2 category fixes" || echo "No changes to commit"
          git push

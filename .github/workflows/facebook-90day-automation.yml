name: Facebook 90-Day Content Automation

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facebook-90day-publisher
  cancel-in-progress: false

jobs:
  publish-due-content:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Prepare image conversion runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          node --version
          magick -version

      - name: Run production scheduler
        env:
          SUPABASE_URL: "https://nrckrzgxpxfwuyodbylg.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          FB_PAGE_ID: "1021253154403079"
          FB_GRAPH_VERSION: "v26.0"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_AUTOMATION_BATCH_SIZE: "3"
          ENABLE_REELS: "true"
        run: node scripts/facebook-90day-scheduler.mjs

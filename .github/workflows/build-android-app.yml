name: Build Obaid Doctrine Android App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-app.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
      - name: Verify keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD"
      - name: Build AAB
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle clean :app:bundleRelease --no-daemon --no-build-cache
      - name: Validate and copy AAB
        run: |
          set -euo pipefail
          cp android-app/app/build/outputs/bundle/release/app-release.aab OBAID_DOCTRINE_v1.0.9_code9.aab
          test -s OBAID_DOCTRINE_v1.0.9_code9.aab
          unzip -t OBAID_DOCTRINE_v1.0.9_code9.aab >/dev/null
          sha256sum OBAID_DOCTRINE_v1.0.9_code9.aab
      - uses: actions/upload-artifact@v4
        with:
          name: OBAID-DOCTRINE-AAB-v1.0.9-code9
          path: OBAID_DOCTRINE_v1.0.9_code9.aab
          if-no-files-found: error
          retention-days: 30
      - if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

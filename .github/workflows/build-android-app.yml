name: Build Obaid Doctrine Android App
# Release build loads the canonical www host used by the Nhost web session.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-app/**"
      - ".github/workflows/build-android-app.yml"

concurrency:
  group: obaid-doctrine-android-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/obaid-doctrine-upload.jks"
          test -s "$RUNNER_TEMP/obaid-doctrine-upload.jks"

      - name: Verify release keystore
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          keytool -list -keystore "$RUNNER_TEMP/obaid-doctrine-upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" >/dev/null

      - name: Clean and build signed release APK
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/obaid-doctrine-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle clean :app:assembleRelease --no-daemon --no-build-cache

      - name: Forensic validate production APK
        shell: bash
        run: |
          set -euo pipefail

          APK_PATH="android-app/app/build/outputs/apk/release/app-release.apk"
          APK_OUT="Obaid_Doctrine__v1.0.6.apk"
          test -f "$APK_PATH"
          cp "$APK_PATH" "$APK_OUT"

          echo "=== FILE ==="
          file "$APK_OUT"
          stat -c 'SIZE_BYTES=%s' "$APK_OUT"

          echo "=== ZIP INTEGRITY ==="
          unzip -t "$APK_OUT" >/dev/null

          echo "=== ZIP ALIGNMENT ==="
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK_OUT"

          echo "=== APK SIGNATURE ==="
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --min-sdk-version 23 "$APK_OUT"

          echo "=== APK CERTIFICATE ==="
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK_OUT"

          echo "=== APK MANIFEST/BADGING ==="
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK_OUT")"
          printf '%s\n' "$BADGING"

          printf '%s\n' "$BADGING" | grep -F "package: name='com.obaiddoctrine.app' versionCode='6' versionName='1.0.6'"
          printf '%s\n' "$BADGING" | grep -F "minSdkVersion:'23'"
          printf '%s\n' "$BADGING" | grep -F "targetSdkVersion:'36'"

          echo "=== ABI CHECK ==="
          if unzip -l "$APK_OUT" | grep -qE '(^| )lib/[^/]+/[^/]+\.so$'; then
            unzip -l "$APK_OUT" | grep -E '(^| )lib/[^/]+/[^/]+\.so$'
          else
            echo "No native .so libraries present; ABI-specific native compatibility check is not applicable."
          fi

          echo "=== SHA-256 ==="
          sha256sum "$APK_OUT"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obaid-Doctrine-Android-v1.0.6
          path: Obaid_Doctrine__v1.0.6.apk
          if-no-files-found: error

      - name: Publish GitHub Release v1.0.6
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: Obaid Doctrine Android App v1.0.6
          body: |
            Official Obaid Doctrine Android App — Version 1.0.6

            Package: com.obaiddoctrine.app
            Minimum Android version: Android 6.0 (API 23)
            Target Android version: Android 16 (API 36)
          files: Obaid_Doctrine__v1.0.6.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish single production APK into repository
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          git rm -f --ignore-unmatch "Obaid_Doctrine__v1.0.3.APK" "Obaid_Doctrine__v1.0.6.APK"
          git add "Obaid_Doctrine__v1.0.6.apk"

          if git diff --cached --quiet; then
            echo "Production APK is already current."
          else
            git commit -m "Publish verified Android app v1.0.6"
            git push origin HEAD:main
          fi

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/obaid-doctrine-upload.jks"

name: Build Obaid Doctrine Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "Obaid_Doctrine__v1.0.3.APK"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle --no-daemon -p android-app :app:assembleRelease

      - name: Locate release APK
        run: |
          APK_PATH="$(find android-app/app/build/outputs -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ]; then
            echo "Release APK not found."
            find android-app/app/build/outputs -maxdepth 6 -type f -print || true
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" Obaid_Doctrine__v1.0.3.APK
          ls -lh Obaid_Doctrine__v1.0.3.APK
          file Obaid_Doctrine__v1.0.3.APK

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Obaid-Doctrine-Android-v1.0.3
          path: Obaid_Doctrine__v1.0.3.APK
          if-no-files-found: error

      - name: Publish APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Obaid_Doctrine__v1.0.3.APK
          git commit -m "Build Obaid Doctrine Android app v1.0.3" || echo "No APK commit needed"
          git pull --rebase origin main
          git push origin HEAD:main

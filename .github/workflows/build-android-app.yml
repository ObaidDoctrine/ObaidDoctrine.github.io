name: Build Obaid Doctrine Android App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "Obaid_Doctrine__v1.0.2.APK"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle --no-daemon -p android-app :app:assembleRelease

      - name: Publish APK into repository
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk Obaid_Doctrine__v1.0.2.APK
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Obaid_Doctrine__v1.0.2.APK
          git commit -m "Build Obaid Doctrine Android app v1.0.2" || echo "No APK commit needed"
          git push

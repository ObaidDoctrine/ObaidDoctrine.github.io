name: Android AAB Build

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android-aab.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode and verify release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/obaid-doctrine-upload.jks"
          test -s "$RUNNER_TEMP/obaid-doctrine-upload.jks"
          keytool -list -keystore "$RUNNER_TEMP/obaid-doctrine-upload.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Build signed release AAB
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/obaid-doctrine-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle clean :app:bundleRelease --no-daemon --no-build-cache

      - name: Validate AAB integrity and upload signature
        shell: bash
        run: |
          set -euo pipefail
          AAB_PATH="android-app/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB_PATH"
          echo "=== FILE ==="
          file "$AAB_PATH"
          stat -c 'SIZE_BYTES=%s' "$AAB_PATH"
          echo "=== ZIP INTEGRITY ==="
          unzip -t "$AAB_PATH" >/dev/null
          echo "=== UPLOAD SIGNATURE ==="
          jarsigner -verify -verbose -certs "$AAB_PATH" >/dev/null
          echo "AAB archive and JAR signature verification passed."
          echo "=== SHA-256 ==="
          sha256sum "$AAB_PATH"

      - name: Upload verified AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBAID-DOCTRINE-Android-v1.0.7-AAB
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Remove release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/obaid-doctrine-upload.jks"

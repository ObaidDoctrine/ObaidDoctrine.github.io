name: Generate raster Mind Test social images

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/mind-tests/*.svg"
      - ".github/workflows/generate-mind-test-social-images.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  rasterize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install SVG renderer
        run: python -m pip install --upgrade pip cairosvg
      - name: Convert SVG designs and update page metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import cairosvg

          folder = Path("assets/mind-tests")
          slugs = []
          for source in sorted(folder.glob("*.svg")):
              target = source.with_suffix(".png")
              cairosvg.svg2png(
                  url=str(source),
                  write_to=str(target),
                  output_width=1200,
                  output_height=630,
              )
              slugs.append(source.stem)
              print(f"Generated {target}")

          for root in (Path("mind-tests"), Path("ur/mind-tests")):
              for page in root.glob("*/index.html"):
                  content = page.read_text(encoding="utf-8")
                  original = content
                  for slug in slugs:
                      content = content.replace(
                          f"assets/mind-tests/{slug}.svg",
                          f"assets/mind-tests/{slug}.png",
                      )
                  if content != original:
                      page.write_text(content, encoding="utf-8")
                      print(f"Updated {page}")
          PY
      - name: Propose generated PNG assets and metadata
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/mind-test-social-images
          delete-branch: true
          commit-message: "Use PNG previews for Mind Tests on social platforms"
          title: "Assets: refresh Mind Test social preview images"
          body: |
            Automatically generated social preview PNGs from the Mind Test SVG artwork.
            The page metadata changes are limited to Open Graph/social image asset paths.
            Review the generated assets and metadata before merging.
          add-paths: |
            assets/mind-tests/*.png
            mind-tests/*/index.html
            ur/mind-tests/*/index.html

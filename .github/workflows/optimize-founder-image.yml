name: Optimize Founder Image

on:
  push:
    paths:
      - ".github/workflows/optimize-founder-image.yml"
      - "assets/file_0000000078948208b532eacd24f12ce9.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Convert original PNG to WebP
        run: |
          python -m pip install --disable-pip-version-check pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          src = Path("assets/file_0000000078948208b532eacd24f12ce9.png")
          dst = Path("assets/file_0000000078948208b532eacd24f12ce9.webp")

          with Image.open(src) as im:
              if im.mode not in ("RGB", "RGBA"):
                  im = im.convert("RGBA")
              im.save(dst, "WEBP", quality=88, method=6)

          print(f"Created {dst}")
          print(f"Original bytes: {src.stat().st_size}")
          print(f"WebP bytes: {dst.stat().st_size}")
          PY

      - name: Use WebP on both homepages with PNG fallback
        run: |
          python - <<'PY'
          from pathlib import Path

          pages = [Path("index.html"), Path("ur/index.html")]
          old = '/assets/file_0000000078948208b532eacd24f12ce9.png'
          webp = '/assets/file_0000000078948208b532eacd24f12ce9.webp'

          for page in pages:
              text = page.read_text(encoding="utf-8")
              target = f'<img src="{old}"'
              replacement = f'<picture><source type="image/webp" srcset="{webp}"><img src="{old}"'
              if target not in text:
                  raise SystemExit(f"Expected hero image not found in {page}")
              text = text.replace(target, replacement, 1)
              text = text.replace('decoding="async">', 'decoding="async"></picture>', 1)
              page.write_text(text, encoding="utf-8")
          PY

      - name: Commit optimized asset and homepage references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/file_0000000078948208b532eacd24f12ce9.webp index.html ur/index.html
          git diff --cached --check
          git commit -m "Optimize founder image delivery for homepage LCP"
          git push

# Verified workflow trigger after initial creation.

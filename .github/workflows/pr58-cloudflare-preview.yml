name: "OBAID DOCTRINE — PR 58 Cloudflare Pages preview"

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

concurrency:
  group: cloudflare-pr58-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-preview:
    # Deliberately limited to this visual-fix PR; never deploy a production branch here.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/mobile-header-and-home-test-card-contrast'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the exact PR commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Deploy isolated Cloudflare Pages preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN repository secret is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repository secret is missing"; exit 1; }
          npx --yes wrangler@4 pages deploy . --project-name=obaid-doctrine --branch=pr-58-preview
          echo "preview_url=https://pr-58-preview.obaid-doctrine.pages.dev" >> "$GITHUB_OUTPUT"

      - name: Verify preview URL responds
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          test -n "$PREVIEW_URL"
          for i in {1..18}; do
            status="$(curl --silent --output /tmp/preview.html --write-out '%{http_code}' "$PREVIEW_URL/" || true)"
            if [ "$status" = "200" ] && grep -qi '<html' /tmp/preview.html; then
              echo "Cloudflare preview returned HTTP 200: $PREVIEW_URL/"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Cloudflare preview did not return a valid HTML homepage: $PREVIEW_URL/"
          exit 1

      - name: Publish preview URL
        if: success()
        run: echo "Preview URL: https://pr-58-preview.obaid-doctrine.pages.dev/" >> "$GITHUB_STEP_SUMMARY"

name: Native Android CI

on:
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/android-native-ci.yml"
  push:
    branches:
      - "feat/native-android-compose-v1"
    paths:
      - "android-app/**"
      - ".github/workflows/android-native-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-build:
    name: Compile native Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Assemble debug APK and run available unit tests
        run: gradle -p android-app --no-daemon :app:assembleDebug :app:testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: obaid-doctrine-native-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

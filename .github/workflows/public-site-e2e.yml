name: "OBAID DOCTRINE — Public Website E2E"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: public-site-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Start local static site
        run: |
          npx --yes http-server@14.1.1 . -p 4173 -c-1 > /tmp/obaid-doctrine-http-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null

      - name: Run public-site E2E against checked-out commit
        env:
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: public-site-playwright-report
          path: playwright-report/
          retention-days: 30

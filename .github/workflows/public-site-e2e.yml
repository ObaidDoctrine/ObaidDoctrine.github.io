name: "OBAID DOCTRINE — Public Website E2E"

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: public-site-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save @playwright/test@1.63.0

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Run public-site E2E
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: public-site-playwright-report
          path: playwright-report/
          retention-days: 30

name: Read-only live SEO and redirect audit

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/audit-live-seo.mjs"
      - ".github/workflows/live-seo-audit.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy OBAID DOCTRINE to Cloudflare Pages"]
    types: [completed]
    branches: ["main"]
  deployment_status:

permissions:
  contents: read

jobs:
  audit:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success')
    name: Audit live sitemap URLs and canonical redirects
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run read-only live audit
        run: node scripts/audit-live-seo.mjs

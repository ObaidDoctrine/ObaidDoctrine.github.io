name: Read-only live SEO and redirect audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit live sitemap URLs and canonical redirects
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Run read-only live audit
        run: node scripts/audit-live-seo.mjs

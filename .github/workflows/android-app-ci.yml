name: Android App CI

on:
  pull_request:
    paths:
      - "android-app/**"
      - "auth/**"
      - ".github/workflows/android-app-ci.yml"
  push:
    branches:
      - "feature/**"
    paths:
      - "android-app/**"
      - "auth/**"
      - ".github/workflows/android-app-ci.yml"

permissions:
  contents: read

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compile debug APK
        working-directory: android-app
        run: gradle clean :app:assembleDebug --no-daemon
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: obaid-doctrine-android-debug-v1.0.7
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Verify app version and auth flow wiring
        run: |
          set -euo pipefail
          grep -F 'versionCode 7' android-app/app/build.gradle
          grep -F 'versionName "1.0.7"' android-app/app/build.gradle
          grep -F 'AUTH_URL' android-app/app/src/main/java/com/obaiddoctrine/app/MainActivity.java
          grep -F 'auth/signup/?app=1' auth/index.html
          grep -F 'signin-link").href=appMode?"/auth/?app=1"' auth/signup/index.html
          grep -F 'obaiddoctrine://auth-success' auth/verify/index.html

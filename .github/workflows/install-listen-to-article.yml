name: Install Listen to Article

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add player to all article pages
        run: |
          python - <<'PY'
          from pathlib import Path
          changed=[]
          for root in ("articles","ur/articles"):
              base=Path(root)
              if not base.exists(): continue
              for p in base.glob("*/index.html"):
                  s=p.read_text(encoding="utf-8")
                  tag='<script src="/listen-to-article.js?v=20260920-2" defer></script>'
                  if "</body>" in s:
                      import re
                      s=re.sub(r'<script src="/listen-to-article\\.js(?:\\?[^"]*)?" defer></script>', tag, s, count=1)
                      if tag not in s:
                          s=s.replace("</body>", tag+"</body>", 1)
                      p.write_text(s, encoding="utf-8")
                      changed.append(str(p))
          print("Updated", len(changed), "article pages")
          for p in changed: print(p)
          PY
      - name: Commit article page updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles ur/articles
          if git diff --cached --quiet; then
            echo "No article pages needed changes."
          else
            git commit -m "Enable Listen to Article on all article pages"
            git push
          fi

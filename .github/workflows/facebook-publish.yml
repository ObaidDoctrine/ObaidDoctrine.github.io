name: Publish New Articles to Facebook

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Publish newly added articles
        env:
          FB_PAGE_ID: "1021253154403079"
          FB_GRAPH_VERSION: "v26.0"
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        shell: bash
        run: bash .github/scripts/publish-facebook.sh

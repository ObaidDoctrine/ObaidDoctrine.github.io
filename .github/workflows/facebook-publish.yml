name: Publish New Articles to Facebook

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate workflow
        run: |
          echo "Facebook publishing workflow is valid and running."
          echo "Commit: ${{ github.sha }}"

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<rect width="1080" height="1350" fill="#FAFAF5"/>
<rect x="0" y="0" width="1080" height="18" fill="#B7D84B"/>
<text x="930" y="90" text-anchor="end" font-family="Noto Nastaliq Urdu, Noto Naskh Arabic, serif" font-size="28" fill="#31543A">نفسیات</text>
<text x="540" y="145" text-anchor="middle" font-family="Noto Nastaliq Urdu, Noto Naskh Arabic, serif" font-size="55" font-weight="700" fill="#31543A">کبھی مایوسی انسان سے نہیں، توقع سے ہوتی ہے</text>
<line x1="90" y1="185" x2="990" y2="185" stroke="#DCE8B5" stroke-width="4"/>
<circle cx="125" cy="247" r="30" fill="#DCE8B5"/><text x="125" y="258" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#31543A">1</text><text x="945" y="255" text-anchor="end" direction="rtl" font-family="Noto Nastaliq Urdu, Noto Naskh Arabic, serif" font-size="31" fill="#31543A">ہم اکثر اس شخص سے ناراض ہوتے ہیں جس نے ہماری توقع پوری نہیں کی۔</text>
<circle cx="125" cy="372" r="30" fill="#DCE8B5"/><text x="125" y="383" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#31543A">2</text><text x="945" y="380" text-anchor="end" direction="rtl" font-family="Noto Nastaliq Urdu, Noto Naskh Arabic, serif" font-size="31" fill="#31543A">لیکن ممکن ہے اسے کبھی معلوم ہی نہ ہو کہ ہم اس سے کیا چاہتے تھے۔</text>
<circle cx="125" cy="497" r="30" fill="#DCE8B5"/><text x="125" y="508" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#31543A">3</text><text x="945" y="505" text-anchor="end" direction="rtl" font-family="Noto Nastaliq Urdu, Noto Naskh Arabic, serif" font-size="31" fill="#31543A">خاموش توقعات وقت کے ساتھ دل میں شکایت پیدا کر سکتی ہیں۔</text>
<circle cx="125" cy="622" r="30" fill="#DCE8B5"/><text x="125" y="633" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#31543A">4</text><text x="945" y="630" text-anchor="end" direction="rtl" font-family="Noto Nastaliq Urdu, Noto Naskh Arabic, serif" font-size="31" fill="#31543A">دوسرا شخص ہماری سوچ نہیں پڑھ سکتا، چاہے وہ ہمارے قریب ہی کیوں نہ ہو۔</text>
<circle cx="125" cy="747" r="30" fill="#DCE8B5"/><text x="125" y="758" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#31543A">5</text><text x="945" y="755" text-anchor="end" direction="rtl" font-family="Noto Nastaliq Urdu, Noto Naskh Arabic, serif" font-size="31" fill="#31543A">واضح بات چیت بہت سی غیر ضروری غلط فہمیوں کو کم کر سکتی ہے۔</text>
<circle cx="125" cy="872" r="30" fill="#DCE8B5"/><text x="125" y="883" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#31543A">6</text><text x="945" y="880" text-anchor="end" direction="rtl" font-family="Noto Nastaliq Urdu, Noto Naskh Arabic, serif" font-size="31" fill="#31543A">ہر مایوسی اس بات کا ثبوت نہیں کہ سامنے والا بے پرواہ ہے۔</text>
<circle cx="125" cy="997" r="30" fill="#DCE8B5"/><text x="125" y="1008" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#31543A">7</text><text x="945" y="1005" text-anchor="end" direction="rtl" font-family="Noto Nastaliq Urdu, Noto Naskh Arabic, serif" font-size="31" fill="#31543A">کبھی مسئلہ انسان نہیں، وہ توقع ہوتی ہے جس کا اظہار ہی نہیں کیا گیا۔</text>
<circle cx="540" cy="1190" r="58" fill="#31543A"/>
<text x="540" y="1198" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#FAFAF5">OD</text>
<text x="540" y="1270" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" letter-spacing="2" fill="#31543A">OBAID DOCTRINE</text>
<text x="540" y="1308" text-anchor="middle" font-family="Arial" font-size="13" letter-spacing="1.2" fill="#6F756F">PSYCHOLOGY • HUMAN BEHAVIOUR • RELATIONSHIPS • SELF-AWARENESS</text>
</svg>
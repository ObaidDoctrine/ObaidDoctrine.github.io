<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><title>What Is Self-Regulation in Psychology?</title><desc>Educational graphic showing goal, monitor, adjust and continue.</desc><rect width="1200" height="675" fill="#fff"/><rect x="72" y="72" width="10" height="531" fill="#b7ff00"/><text x="125" y="170" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="5" fill="#151515">OBAID DOCTRINE</text><text x="125" y="285" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="800" fill="#111">SELF-REGULATION</text><text x="125" y="350" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#333">Goal • Monitor • Evaluate • Adjust</text><path d="M155 475 H980" stroke="#111" stroke-width="4"/><circle cx="190" cy="475" r="18" fill="#b7ff00" stroke="#111" stroke-width="4"/><circle cx="450" cy="475" r="18" fill="#b7ff00" stroke="#111" stroke-width="4"/><circle cx="710" cy="475" r="18" fill="#b7ff00" stroke="#111" stroke-width="4"/><circle cx="970" cy="475" r="18" fill="#b7ff00" stroke="#111" stroke-width="4"/><text x="155" y="535" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#333">Goal</text><text x="400" y="535" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#333">Monitor</text><text x="660" y="535" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#333">Evaluate</text><text x="925" y="535" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#333">Adjust</text></svg>
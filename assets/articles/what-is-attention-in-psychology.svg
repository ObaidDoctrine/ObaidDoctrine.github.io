<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><title>What Is Attention in Psychology?</title><desc>Educational graphic showing attention selecting relevant information from competing signals.</desc><rect width="1200" height="675" fill="#fff"/><rect x="72" y="72" width="10" height="531" fill="#b7ff00"/><text x="125" y="170" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" letter-spacing="5" fill="#151515">OBAID DOCTRINE</text><text x="125" y="285" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="800" fill="#111">ATTENTION</text><text x="125" y="350" font-family="Arial,Helvetica,sans-serif" font-size="34" fill="#333">Select • Sustain • Shift</text><circle cx="220" cy="475" r="24" fill="#b7ff00" stroke="#111" stroke-width="4"/><circle cx="400" cy="475" r="24" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="580" cy="475" r="24" fill="#fff" stroke="#111" stroke-width="4"/><circle cx="760" cy="475" r="24" fill="#fff" stroke="#111" stroke-width="4"/><path d="M245 475 H735" stroke="#111" stroke-width="4"/><text x="165" y="535" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#333">Relevant</text><text x="370" y="535" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#333">Competing</text><text x="555" y="535" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#333">Focus</text><text x="735" y="535" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#333">Response</text></svg>
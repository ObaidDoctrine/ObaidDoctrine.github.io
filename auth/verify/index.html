<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Verification | OBAID DOCTRINE</title>
<meta name="robots" content="noindex,nofollow">
</head>
<body>
<main>
<h1>Email Verification</h1>
<p id="status">Verifying your email…</p>
<p><a href="/auth/">Back to Sign In</a></p>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@nhost/nhost-js@4.8.0";

const nhost = createClient({
  subdomain: "twttbujomdakckte",
  region: "eu-central-1"
});

const params = new URLSearchParams(location.search);
const appMode = params.get("app") === "1";
const code = params.get("code");
const verifier = localStorage.getItem("nhost_pkce_verifier");
const status = document.getElementById("status");

try {
  if (!code || !verifier) {
    throw new Error("Verification link is missing required information.");
  }

  const response = await nhost.auth.tokenExchange({
    code,
    codeVerifier: verifier
  });

  localStorage.removeItem("nhost_pkce_verifier");

  if (!response.body?.session) {
    throw new Error("Email verification did not establish an authenticated session.");
  }

  status.textContent = "Email verified successfully. Opening OBAID DOCTRINE…";

  if (appMode) {
    window.location.replace("obaiddoctrine://auth-success");
  } else {
    setTimeout(() => {
      location.href = "/auth/";
    }, 800);
  }
} catch (error) {
  status.textContent =
    error?.body?.message ||
    error?.message ||
    "Email verification failed.";
}
</script>
</body>
</html>

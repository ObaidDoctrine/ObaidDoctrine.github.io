<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Verify your email | OBAID DOCTRINE</title>
<style>
:root{color-scheme:dark;--orange:#ff7a1a;--ink:#101010;--panel:#191919}
*{box-sizing:border-box}
body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:var(--ink);color:#f8f6f1;font:16px/1.6 system-ui,sans-serif}
main{width:min(100%,520px);padding:32px;border:1px solid #38322c;border-radius:22px;background:var(--panel);box-shadow:0 18px 55px #0007}
.brand{color:var(--orange);font-weight:900;letter-spacing:.08em;text-decoration:none}
h1{margin:28px 0 8px;font-size:clamp(2rem,7vw,3rem);line-height:1.05}
p{color:#c5c0b8}
#status{min-height:48px}
a{color:#ffad75;font-weight:700}
</style>
</head>
<body>
<main>
<a class="brand" href="/">OBAID DOCTRINE</a>
<h1>Email verification</h1>
<p id="status" role="status" aria-live="polite">Verifying your email securely…</p>
<p><a href="/auth/">Return to sign in</a></p>
</main>
<script type="module">
import { createClient } from "https://esm.sh/@nhost/nhost-js@4.8.0";

const nhost = createClient({
  subdomain: "ctwtjtbtbujomdskcktc",
  region: "eu-central-1"
});
const params = new URLSearchParams(location.search);
const appMode = params.get("app") === "1";
const code = params.get("code");
const verifier = localStorage.getItem("nhost_pkce_verifier");
const status = document.getElementById("status");

function safeReturnTo(value) {
  if (!value || !value.startsWith("/") || value.startsWith("//")) return null;
  try {
    const url = new URL(value, location.origin);
    if (url.origin !== location.origin || url.pathname.startsWith("/auth/")) return null;
    return url.pathname + url.search + url.hash;
  } catch {
    return null;
  }
}

try {
  if (!code || !verifier) {
    throw new Error("This verification link is incomplete or was opened in a different browser. Return to sign up and request a new verification email.");
  }

  const response = await nhost.auth.tokenExchange({ code, codeVerifier: verifier });
  localStorage.removeItem("nhost_pkce_verifier");

  if (!response.body?.session?.user) {
    throw new Error("Your email was verified, but a login session was not created. Please sign in with your email and password.");
  }

  status.textContent = "Email verified. Your account is ready.";

  if (appMode) {
    const returnTo = safeReturnTo(params.get("returnTo"));
    const callback = "obaiddoctrine://auth-success" + (returnTo
      ? "?returnTo=" + encodeURIComponent(returnTo)
      : "");
    window.location.replace(callback);
  } else {
    const returnTo = safeReturnTo(params.get("returnTo"));
    const loginUrl = new URL("/auth/", location.origin);
    if (returnTo) loginUrl.searchParams.set("returnTo", returnTo);
    window.setTimeout(() => window.location.replace(loginUrl.toString()), 900);
  }
} catch (error) {
  console.error("Nhost email verification failed:", error);
  status.textContent =
    error?.body?.message ||
    error?.message ||
    "Email verification failed. Please try again or contact support.";
  status.dataset.type = "error";
}
</script>
</body>
</html>

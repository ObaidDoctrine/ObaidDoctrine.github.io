<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account | OBAID DOCTRINE</title>
<meta name="description" content="Sign in to your OBAID DOCTRINE account.">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://www.obaiddoctrine.com/auth/">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link rel="stylesheet" href="/styles.css?v=ultra-editorial-20261003">
<style>
.auth-page{min-height:100vh;background:#101010;color:#f8f6f1}
.auth-wrap{width:min(92%,520px);margin:0 auto;padding:70px 0}
.auth-card{background:#191919;border:1px solid rgba(255,255,255,.12);border-radius:28px;padding:32px;box-shadow:0 18px 55px rgba(0,0,0,.28)}
.auth-brand{font-weight:900;letter-spacing:.08em;color:#ff7a1a;text-decoration:none}
.auth-card h1{font-size:clamp(2rem,7vw,3.4rem);line-height:1;letter-spacing:-.05em;margin:28px 0 10px;color:#fff}
.auth-card p{color:#c5c0b8;line-height:1.6}
.auth-field{display:grid;gap:7px;margin:18px 0}
.auth-field label{font-size:12px;font-weight:800;letter-spacing:.08em;color:#ff9a50}
.auth-field input{width:100%;box-sizing:border-box;padding:14px 15px;border:1px solid rgba(255,255,255,.18);border-radius:12px;background:#101010;color:#fff;font:inherit}
.auth-field input:focus{outline:2px solid #ff7a1a;outline-offset:2px}
.auth-button{width:100%;padding:14px 18px;border:0;border-radius:12px;background:#ff7a1a;color:#17110b;font-weight:900;cursor:pointer}
.auth-button:disabled{opacity:.55;cursor:wait}
.auth-secondary{margin-top:16px}
.auth-secondary a{color:#ff9a50;font-weight:800}
.auth-status{min-height:24px;margin-top:18px;font-size:14px;color:#ddd}
.auth-status[data-type="error"]{color:#ff8b8b}
.auth-status[data-type="success"]{color:#8bd5a5}
.auth-session{padding:20px;border-radius:18px;background:#24201b;border:1px solid rgba(255,122,26,.35)}
.auth-session strong{display:block;margin-bottom:8px;color:#fff}
[hidden]{display:none!important}
@media(max-width:560px){.auth-wrap{padding:36px 0}.auth-card{padding:24px;border-radius:20px}}
</style>
</head>
<body class="auth-page">
<main class="auth-wrap">
<a class="auth-brand" href="/">OBAID DOCTRINE</a>
<section class="auth-card" aria-labelledby="auth-title">
<h1 id="auth-title">Your Account</h1>
<p>Sign in to continue. Your secure account session is restored when you return.</p>
<div id="login-panel">
<form id="login-form" novalidate>
<div class="auth-field">
<label for="email">EMAIL</label>
<input id="email" name="email" type="email" autocomplete="username" required>
</div>
<div class="auth-field">
<label for="password">PASSWORD</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
</div>
<button id="login-button" class="auth-button" type="submit">Sign In</button>
</form>
</div>
<div id="session-panel" class="auth-session" hidden>
<strong>You are signed in.</strong>
<span id="user-email"></span>
<div class="auth-secondary"><button id="logout-button" class="auth-button" type="button">Sign Out</button></div>
</div>
<div id="auth-status" class="auth-status" role="status" aria-live="polite">Checking session…</div>
<p class="auth-secondary"><a id="signup-link" href="/auth/signup/">Create a new account</a></p>
<p class="auth-secondary"><a id="recovery-link" href="/auth/recovery/">Forgot password or need a new verification email?</a></p>
<p class="auth-secondary"><a href="/">← Back to OBAID DOCTRINE</a></p>
</section>
</main>
<script>
const appMode = new URLSearchParams(location.search).get("app") === "1";
const returnTo = new URLSearchParams(location.search).get("returnTo");
const suffix = new URLSearchParams();
if (appMode) suffix.set("app", "1");
if (returnTo) suffix.set("returnTo", returnTo);
const query = suffix.toString();
document.getElementById("signup-link").href = "/auth/signup/" + (query ? "?" + query : "");
document.getElementById("recovery-link").href = "/auth/recovery/" + (query ? "?" + query : "");
</script>
<script type="module" src="/auth/auth.js"></script>
</body>
</html>
